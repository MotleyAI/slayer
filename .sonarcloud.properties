# SonarCloud automatic analysis reads this file, not sonar-project.properties.
# The comparison suite's .sql files are DuckDB and dbt SQL, which the PL/SQL analyzer misreads as Oracle.
# The Cube-JS fixtures are Cube FILTER_PARAMS DSL, which SonarJS misreads as JavaScript.
sonar.exclusions=examples/comparisons/**/*.sql,tests/fixtures/cube_js/**
