- name: monthly_revenue
  source: "SELECT\n  _stage_inner.\"orders.ordered_on\" AS \"ordered_on\",\n  _stage_inner.\"\
    orders.revenue\" AS \"revenue\"\nFROM (\n  SELECT\n    DATE_TRUNC('MONTH', orders.ordered_on)\
    \ AS \"orders.ordered_on\",\n    CAST(SUM(orders.amount) AS DOUBLE) AS \"orders.revenue\"\
    \n  FROM orders AS orders\n  WHERE\n    orders.region = 'US'\n  GROUP BY\n   \
    \ DATE_TRUNC('MONTH', orders.ordered_on)\n) AS _stage_inner"
  unique_keys:
  - - ordered_on
  fields:
  - name: ordered_on
    expression:
      sql: ordered_on
    datatype: Date
    nonportable_extensions:
    - vendor_name: SLAYER
      data:
        version: 1
        entity: ordered_on
        fingerprint: 264c43fb68adb018ac9af5c5576f692a9e448f7f2ed9f44b98d6c2b3ef35d051
        kind: field
        column:
          sql: ordered_on
          type: DATE
          hidden: false
          granularity: month
  - name: revenue
    expression:
      sql: revenue
    description: Gross order value
    datatype: Float
    nonportable_extensions:
    - vendor_name: SLAYER
      data:
        version: 1
        entity: revenue
        fingerprint: 7b3c7224c17dca495806d8684fd2277d50630dd01089f07773aec7f5b3ae9011
        kind: field
        column:
          sql: revenue
          type: DOUBLE
          hidden: false
          format:
            type: currency
            precision: 2
            symbol: $
  nonportable_extensions:
  - vendor_name: SLAYER
    data:
      version: 1
      entity: monthly_revenue
      fingerprint: d6a8481f693c0f1f7f3b4ba4e72fec458299b98461bbc14ec752a86ae8cf8c43
      kind: dataset
      source:
        filters: []
        source_queries:
        - version: 15
          source_model: orders
          measures:
          - formula: sum(amount)
            name: revenue
          time_dimensions:
          - dimension: ordered_on
            granularity: month
          filters:
          - region = '{region}'
          whole_periods_only: false
          distinct_dimension_values: true
        query_variables:
          region: US
      hidden: false
      access_tags: []
      aggregations: []
      columns: []
      measures: []
