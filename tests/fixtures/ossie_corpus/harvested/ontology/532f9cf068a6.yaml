document:
  version: 0.3.0.dev0
  name: sales_mapping
  ontology_ref:
    name: sales
    iri: ./sales.ontology.yaml
  semantic_model_ref:
    name: sales_model
    iri: ./sales.semantic_model.yaml
  concept_mappings:
  - concept: ''
    object_mappings:
    - concept: Order
      referent_mappings:
      - relationship: order_id
        expression: orders.order_id
    link_mappings:
    - relationship: customer
      object_mapping:
        expression: orders.customer_id
files: {}
