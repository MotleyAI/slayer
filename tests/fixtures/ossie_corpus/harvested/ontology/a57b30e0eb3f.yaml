document:
  concept_mappings:
  - concept: Order
    object_mappings:
    - expression: orders.order_nr
  name: sales_mapping
  ontology_ref:
    iri: ./sales.ontology.yaml
    name: sales
  semantic_model_ref:
    iri: ./sales.semantic_model.yaml
    name: sales_model
  version: 0.3.0.dev0
files:
  ./sales.ontology.yaml: "name: sales\nontology:\n- concept: Party\n  relationships:\n  - name: nr\n    roles:\n    - concept: Integer\n    verbalizes:\n    - '{_} has {Integer}'\n  type: EntityType\n- concept: Customer\n  extends:\n  - Party\n  identify_by:\n  - nr\n  type: EntityType\n- concept: Order\n  identify_by:\n  - nr\n  relationships:\n  - name: nr\n    roles:\n    - concept: Integer\n    verbalizes:\n    - '{_} has {Integer}'\n  - name: customer\n    roles:\n    - concept: Customer\n    verbalizes:\n    - '{_} has {Customer}'\n  - name: placed_by\n    verbalizes:\n    - '{Order} is placed'\n  - name: total\n    roles:\n    - concept: Decimal\n    verbalizes:\n    - '{_} has {Decimal}'\n  - name: active\n    verbalizes:\n    - '{Order} is active'\n  type: EntityType\nversion: 0.3.0.dev0\n"
  ./sales.semantic_model.yaml: "datasets:\n- fields:\n  - expression: &id001\n      dialects:\n      - dialect: ANSI_SQL\n        expression: order_id\n    name: order_id\n  - expression: *id001\n    name: customer_id\n  name: orders\n  source: sales.public.orders\nname: sales_model\nversion: 0.3.0.dev0\n"
