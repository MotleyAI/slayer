version: 0.3.0.dev0
name: m
datasets:
- name: orders
  source: db.s.orders
  fields:
  - name: customer_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: customer_id
  - name: product_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: product_id
  - name: variant_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: variant_id
relationships: []
metrics:
- name: revenue
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(CASE WHEN s = 1 THEN amt ELSE 0 END)
    - dialect: BIGQUERY
      expression: SUM(IF(s = 1, amt, 0))
