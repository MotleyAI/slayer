version: 15
name: orders
sql_table: orders
query_variables: {}
data_source: warehouse
columns:
- name: id
  type: INT
  primary_key: true
  unique: false
  hidden: false
- name: customer_id
  type: INT
  primary_key: false
  unique: false
  hidden: false
- name: status
  type: TEXT
  primary_key: false
  unique: false
  hidden: false
- name: amount
  type: DOUBLE
  primary_key: false
  unique: false
  hidden: false
- name: paid_amount
  sql: amount
  type: DOUBLE
  primary_key: false
  unique: false
  hidden: false
  filter: status = 'paid'
- name: status_upper
  sql: UPPER(status)
  type: TEXT
  primary_key: false
  unique: false
  hidden: false
- name: tags
  type: ARRAY
  element_type: TEXT
  primary_key: false
  unique: false
  hidden: false
- name: created_at
  type: TIMESTAMP
  primary_key: false
  unique: false
  hidden: false
measures:
- formula: sum(amount)
  name: revenue
- formula: count(*)
  name: order_count
- formula: revenue / order_count
  name: aov
- formula: sum(paid_amount)
  name: paid_revenue
- formula: count_distinct(customers.email)
  name: customer_count
- formula: spread(amount)
  name: amount_spread
aggregations:
- name: spread
  formula: MAX({value}) - MIN({value})
  params: []
joins:
- target_model: customers
  join_pairs:
  - - customer_id
    - id
  join_type: left
  cardinality: many_to_one
filters:
- status <> 'cancelled'
default_time_dimension: created_at
hidden: false
access_tags: []
