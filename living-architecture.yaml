# Config for the la-* tools (github.com/MotleyAI/living-architecture).
format: 0.4.0
architecture: true
reviewers:
  sonar:
    project_key: MotleyAI_slayer
issue_key_pattern: "DEV-\\d+"
commands:
  test: poetry run pytest -m "not integration"
  lint: poetry run ruff check slayer/ tests/
conventions:
  text_ratio_max: 0.15
  exempt:
    - slayer/mcp/server.py
