# SonarCloud configuration.
#
# Required so the project key resolves the same way locally as in
# SonarCloud, and so we can carry exclusions in-repo.

sonar.projectKey=MotleyAI_slayer
sonar.organization=motleyai

# Copy-Paste Detector exclusions (the SonarQube-canonical equivalent of
# NOSONAR for the duplication gate — CPD has no per-line suppression form).
#
# The three per-dialect integration test files are by-design
# mirrors of `tests/integration/test_integration_postgres.py` plus
# dialect-specific tweaks (DDL syntax, type narrowing, NotImplementedError
# expectations, etc.). The duplication is intentional — extracting the
# shared bits into a helper would tangle dialect concerns without changing
# the per-dialect specifics. Suppress at the file level.
sonar.cpd.exclusions=tests/integration/test_integration_mysql.py,tests/integration/test_integration_clickhouse.py,tests/integration/test_integration_sqlserver.py

# The Cube-JS import fixtures under tests/fixtures/cube_js/ are Cube
# FILTER_PARAMS DSL, not executable JavaScript. SonarJS misreads the
# `${FILTER_PARAMS...filter((from, to) => ...)}` arrows inside SQL template
# literals (e.g. S7770), and a NOSONAR comment can't live inside the SQL string.
# Suppress JS issue analysis on that fixture tree.
#
# The comparison suite's .sql files are DuckDB and dbt SQL, which the PL/SQL
# analyzer misreads as Oracle (VARCHAR2, mandatory sizes).
sonar.issue.ignore.multicriteria=cubejs_fixtures,comparisons_sql
sonar.issue.ignore.multicriteria.cubejs_fixtures.ruleKey=javascript:*
sonar.issue.ignore.multicriteria.cubejs_fixtures.resourceKey=tests/fixtures/cube_js/**
sonar.issue.ignore.multicriteria.comparisons_sql.ruleKey=plsql:*
sonar.issue.ignore.multicriteria.comparisons_sql.resourceKey=examples/comparisons/**/*.sql
