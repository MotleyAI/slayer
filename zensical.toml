    ]},
    { "MCP Introspection" = "examples/08_mcp_introspect/mcp_introspect_nb.ipynb" },
    { "Lightning Talk" = [
      "examples/09_lightning_talk/lightning_talk.md",
      { "Notebook" = "examples/09_lightning_talk/lightning_talk_nb.ipynb" },
    ]},
    { "Row-Level Security" = [
      { "Notebook" = "examples/10_row_level_security/row_level_security_nb.ipynb" },
    ]},
    { "Query Cache" = [
      { "Notebook" = "examples/12_query_cache/query_cache_nb.ipynb" },
    ]},
    { "Variable Substitution" = [
      "examples/14_variable_substitution/variable_substitution.md",
      { "Notebook" = "examples/14_variable_substitution/variable_substitution_nb.ipynb" },
    ]},
    { "DuckDB" = [
      "examples/15_duckdb/duckdb.md",
      { "Notebook (Python)" = "examples/15_duckdb/duckdb_python_nb.ipynb" },
      { "Notebook (CLI)" = "examples/15_duckdb/duckdb_cli_nb.ipynb" },
    ]},
    { "List Fields" = [
      "examples/16_list_fields/list_fields.md",
      { "Notebook" = "examples/16_list_fields/list_fields_nb.ipynb" },
    ]},
  ]},
  { "Reference" = [
    { "MCP Server" = "reference/mcp.md" },
    { "REST API" = "reference/rest-api.md" },
    { "Python Client" = "reference/python-client.md" },
    { "CLI" = "reference/cli.md" },
    { "Glossary" = "concepts/terminology.md" },
    { "Ossie Layer 3" = "interfaces/ossie-layer-3.md" },
    { "Ossie compliance" = "interfaces/ossie-compliance.md" },
  ]},
  { "Contributing" = "development.md" },
