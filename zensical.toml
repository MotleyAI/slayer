# SLayer documentation site (Zensical).
#
# This is the source of truth for the SLayer documentation navigation. The
# combined product site at https://docs.motley.ai pulls this nav on every
# SLayer release and grafts it under its "SLayer" tab (re-rooting every local
# path under `slayer/`), so keep `nav` below in sync with the files in `docs/`.
#
# Notebooks (.ipynb) are listed as paths relative to this docs/ dir, like pages.
# Zensical has no Jupyter plugin, so they don't render inline: the docs-sync
# rewrites these entries to GitHub links (at the released tag) on the combined
# site, and local `zensical serve` shows them as plain (non-rendering) links.

[project]
site_name = "SLayer"
site_description = "A lightweight semantic layer for AI agents"
site_url = "https://docs.motley.ai/slayer/"

nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    "getting-started/index.md",
    { "MCP (AI Agents)" = "getting-started/mcp.md" },
    { "CLI (Terminal)" = "getting-started/cli.md" },
    { "REST API (Any Language)" = "getting-started/rest-api.md" },
    { "Python SDK" = "getting-started/python.md" },
  ]},
  { "Connect your data" = [
    { "Datasources" = "configuration/datasources.md" },
    { "Database Support" = "database-support.md" },
    { "Storage Backends" = "configuration/storage.md" },
    { "SQL Clients" = "configuration/sql-clients.md" },
    { "Flight SQL" = "interfaces/flight-sql.md" },
    { "SQL API" = "interfaces/pg-facade.md" },
  ]},
  { "Model your data" = [
    { "Datasets" = "concepts/datasets.md" },
    { "Semantic Models" = "concepts/semantic-models.md" },
    { "Ontologies and Mappings" = "concepts/ontologies.md" },
    { "Auto-Ingestion" = "concepts/ingestion.md" },
    { "Schema Drift" = [
      "concepts/schema-drift.md",
      { "Worked example" = "examples/schema-drift.md" },
    ]},
    { "dbt" = [
      { "SLayer vs dbt" = "dbt/slayer_vs_dbt.md" },
      { "Importing dbt definitions" = "dbt/dbt_import.md" },
      { "Tutorial" = [
        "examples/11_dbt_metricflow/dbt_metricflow.md",
        { "Notebook" = "examples/11_dbt_metricflow/dbt_metricflow_nb.ipynb" },
      ]},
    ]},
    { "Cube" = [
      { "Importing Cube definitions" = "cube/cube_import.md" },
      { "Tutorial" = [
        "examples/17_cube_import/cube_import.md",
        { "Notebook" = "examples/17_cube_import/cube_import_nb.ipynb" },
      ]},
    ]},
    { "OSI" = [
      { "Importing Ossie documents" = "osi/osi_import.md" },
      { "Exporting to OSI" = "osi/osi_export.md" },
      { "Tutorial" = [
        "examples/13_osi_import/osi_import.md",
        { "Notebook (library)" = "examples/13_osi_import/osi_import_nb.ipynb" },
        { "Notebook (agent: CLI + MCP)" = "examples/13_osi_import/osi_import_agent_nb.ipynb" },
      ]},
    ]},
  ]},
  { "Query your data" = [
    { "Queries" = "concepts/queries.md" },
    { "Expressions" = "concepts/expressions.md" },
    { "Time" = "concepts/time.md" },
    { "Filters" = "concepts/filters.md" },
    { "Cross-Dataset Queries" = "concepts/cross-dataset-queries.md" },
    { "Saved & Multistage Queries" = "concepts/saved-and-multistage-queries.md" },
    { "SQL vs DSL" = "concepts/references.md" },
  ]},
  { "Agent context" = [
    { "Memories" = "concepts/memories.md" },
    { "Search" = "concepts/search.md" },
  ]},
  { "Operate" = [
    { "Row-Level Security" = "concepts/row-level-security.md" },
    { "Query Cache" = "concepts/query-cache.md" },
    { "OpenTelemetry" = "reference/opentelemetry.md" },
    { "Usage Reporting" = "reference/usage-reporting.md" },
    { "Upgrading to 2.0" = "upgrading/2.0.md" },
    { "Upgrading to the Ossie Stored Format" = "upgrading/stored-format.md" },
  ]},
  { "Tutorials" = [
    { "Make it dynamic" = "examples/01_dynamic/dynamic.md" },
    { "SQL vs DSL" = [
      "examples/02_sql_vs_dsl/sql_vs_dsl.md",
      { "Notebook" = "examples/02_sql_vs_dsl/sql_vs_dsl_nb.ipynb" },
    ]},
    { "Auto-Ingestion" = [
      "examples/03_auto_ingest/auto_ingest.md",
      { "Notebook" = "examples/03_auto_ingest/auto_ingest_nb.ipynb" },
    ]},
    { "Time Dimensions" = [
      "examples/04_time/time.md",
      { "Notebook" = "examples/04_time/time_nb.ipynb" },
    ]},
    { "Relationships" = [
      "examples/05_relationships/relationships.md",
      { "Notebook" = "examples/05_relationships/relationships_nb.ipynb" },
    ]},
    { "Joined Metrics" = [
      "examples/05_joined_metrics/joined_metrics.md",
      { "Notebook" = "examples/05_joined_metrics/joined_metrics_nb.ipynb" },
