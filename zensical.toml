# Old URLs of pages moved off the 1.x vocabulary.
[project.plugins.redirects.redirect_maps]
"concepts/models.md" = "concepts/datasets.md"
"concepts/formulas.md" = "concepts/expressions.md"
"examples/05_joins/joins.md" = "examples/05_relationships/relationships.md"
"examples/05_joined_measures/joined_measures.md" = "examples/05_joined_metrics/joined_metrics.md"
"examples/16_list_columns/list_columns.md" = "examples/16_list_fields/list_fields.md"

[project.theme]
features = [
  "navigation.indexes",
  "navigation.top",
  "navigation.expand",
  "navigation.path",
  "toc.follow",
]
logo = "SLayer.png"
favicon = "SLayer.png"

[[project.theme.palette]]
primary = "custom"
