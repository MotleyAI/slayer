# Cross-walk between the LikeC4 model, import-linter contracts, arc42 files,
# and OpenSpec specs. Checked by tools/arch_check.py; schema in system.arc42.md.

nodes:
  core:
    package: slayer.core
    claims: [slayer.async_utils]
    arc42: architecture/core.arc42.md
  sql:
    package: slayer.sql
    children: [render, dialects]
    arc42: architecture/sql.arc42.md
  engine:
    package: slayer.engine
    arc42: architecture/engine.arc42.md
  storage:
    package: slayer.storage
  importers:
    virtual: true
    packages: [slayer.dbt, slayer.cube, slayer.osi, slayer.ingest_report]
  search:
    virtual: true
    packages: [slayer.search, slayer.embeddings]
  memories:
    virtual: true
    packages: [slayer.memories]
  protocols:
    virtual: true
    packages: [slayer.flight, slayer.pg_facade, slayer.facade]
    specs: [facade]
  surfaces:
    virtual: true
    specs: [mcp]
    packages:
      - slayer.api
      - slayer.mcp
      - slayer.cli
      - slayer.client
      - slayer.inspect
      - slayer.demo
      - slayer.__main__

# Grandfathered-edge counts per import-linter contract; arch_check fails if a
# contract's ignore_imports count differs from its baseline. Only ever lower these.
contracts:
  layers: {baseline: 14}
  forbidden: {baseline: 2}

# Fail-closed deferral-site count (tests/test_law_guard_ratchet.py). Only ever lower.
guards: {baseline: 10}

cross_cutting_specs:
  queries: {touches: [core, engine, sql]}
  models: {touches: [core, storage, engine]}
  aggregations: {touches: [core, engine, sql]}

# arc42 files not owned by one node; arch_check flags unlisted orphans.
cross_cutting_arc42: [architecture/semantics.arc42.md]
