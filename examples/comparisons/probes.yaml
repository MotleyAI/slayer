    truth_sql: |
      with cr as (select r.name n, sum(c.credit) cs from customers c left join regions r on c.region_id = r.id group by 1),
           oc as (select r.name n, count(o.id) k from customers c left join regions r on c.region_id = r.id
                  left join orders o on o.customer_id = c.id group by 1)
      select cr.n, cr.cs, oc.k from cr join oc on cr.n is not distinct from oc.n
    compare: {keys: [regions.name], values: [customers.credit_sum, orders.count]}
    cube:
