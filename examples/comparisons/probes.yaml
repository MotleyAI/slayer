  # ------------------------------------------------------------------ Q5 calculated dimensions, filters, order
  - id: Q5a
    row: Q5
    title: revenue by customer-total band (high if the customer's total > 250)
    truth_sql: |
      select case when c.ct > 250 then 'high' else 'low' end as band, sum(o.amount) as revenue
      from orders o join (select customer_id, sum(amount) ct from orders group by 1) c
        on o.customer_id is not distinct from c.customer_id
      group by 1
    compare: {keys: [band], values: [revenue]}
    slayer:
      query: {source_model: orders,
              dimensions: [{expression: "CASE WHEN sum(amount, partition_by=customer_id) > 250 THEN 'high' ELSE 'low' END", name: band}],
              measures: [{formula: "sum(amount)", name: revenue}]}
    malloy:
      note: a query-derived source joined back with join_one, then a pick band
      query: |
        query: cust_facts is orders -> { group_by: customer_id; aggregate: cust_rev is revenue }
        source: o2 is orders extend {
          join_one: cust_facts on customer_id = cust_facts.customer_id
          dimension: band is pick 'high' when cust_facts.cust_rev > 250 else 'low'
        }
        run: o2 -> { group_by: band; aggregate: revenue }
    cube:
      note: SQL API, a CASE band in an outer query over a nested per-customer query
      sql: |
        select case when ct > 250 then 'high' else 'low' end as band, sum(ct) as revenue
        from (select customer_id, measure(revenue) as ct from orders group by 1) t group by 1

  - id: Q5a2
    row: Q5
    title: order count per band
    truth_sql: |
      select case when c.ct > 250 then 'high' else 'low' end as band, count(*) as order_count
      from orders o join (select customer_id, sum(amount) ct from orders group by 1) c
        on o.customer_id is not distinct from c.customer_id
      group by 1
    compare: {keys: [band], values: [order_count]}
    slayer:
      query: {source_model: orders,
              dimensions: [{expression: "CASE WHEN sum(amount, partition_by=customer_id) > 250 THEN 'high' ELSE 'low' END", name: band}],
              measures: [{formula: "count(*)", name: order_count}]}
    malloy:
      query: |
        query: cust_facts is orders -> { group_by: customer_id; aggregate: cust_rev is revenue }
        source: o2 is orders extend {
          join_one: cust_facts on customer_id = cust_facts.customer_id
          dimension: band is pick 'high' when cust_facts.cust_rev > 250 else 'low'
        }
        run: o2 -> { group_by: band; aggregate: order_count }

  - id: Q5a-in-dimension
    row: Q5
    title: an aggregate inside a dimension
    malloy:
      query: |
        run: orders extend { dimension: band is pick 'high' when revenue > 250 else 'low' } -> { group_by: band; aggregate: revenue }
      expect: {compile_error: aggregate-in-dimension}

  - id: Q5b
    row: Q5
    title: filter rank(sum(amount)) <= 2 (top two customers)
    truth_sql: |
      select c.name, sum(o.amount) from orders o left join customers c on o.customer_id = c.id
      group by 1 order by 2 desc limit 2
    compare: {keys: [customers.name], values: [v]}
    slayer:
      query: {source_model: orders, dimensions: [customers.name], filters: ["rank(sum(amount)) <= 2"],
              measures: [{formula: "sum(amount)", name: v}]}
    metricflow:
      note: order by the selected metric plus a global limit
      query:
        metrics: [revenue]
        group_by: [customer__name]
        order: [-revenue]
        limit: 2
      keys: [customer__name]
      values: [revenue]

  - id: Q5-having
    row: Q5
    title: having on an aggregate
    truth_sql: |
      select c.name, sum(o.amount) as revenue from orders o left join customers c on o.customer_id = c.id
      group by 1 having sum(o.amount) > 300
    compare: {keys: [name], values: [revenue]}
    malloy:
      query: |
        run: orders -> { group_by: customers.name; aggregate: revenue; having: revenue > 300 }
    metricflow:
      note: a metric filter at the customer entity acts as HAVING
      query:
        metrics: [revenue]
        group_by: [customer__name]
        where: ['{{ Metric(''revenue'', group_by=[''customer'']) }} > 300']
      keys: [customer__name]
      values: [revenue]

  - id: Q5-agg-in-where
    row: Q5
    title: an aggregate in where
    malloy:
      query: |
        run: orders -> { where: revenue > 300; group_by: customers.name; aggregate: revenue }
      expect: {compile_error: aggregate-in-where}

  - id: Q5-calc-in-having
    row: Q5
    title: a calculation in having
    malloy:
      query: |
        run: orders -> { group_by: m is order_date.month; aggregate: revenue; calculate: prev is lag(revenue); having: prev > 100 }
      expect: {compile_error: analytic-in-having}

  - id: Q5-order-by-expr
    row: Q5
    title: order_by an expression (order_count * 2)
    malloy:
      query: |
        run: orders -> { group_by: status; aggregate: order_count; order_by: order_count * 2 desc }
      expect: {compile_error: syntax-error}

  - id: Q5d
    row: Q5
    title: filter change(sum(amount)) > 0 (calendar-aware)
    truth_sql: |
      with m as (select date_trunc('month', order_date) as month, sum(amount) as rev from orders group by 1)
      select a.month, a.rev from m a join m b on b.month = a.month - interval 1 month where a.rev - b.rev > 0
    compare: {keys: [order_date], values: [v]}
    slayer:
      query: {source_model: orders, time_dimensions: [{dimension: order_date, granularity: month}],
              filters: ["change(sum(amount)) > 0"], measures: [{formula: "sum(amount)", name: v}]}

  - id: F8
    row: Q5
    title: computed dimension over a city-total aggregate, with region
    truth_sql: |
      select region, case when ct > 400 then 'big' else 'small' end as band, sum(amount) from (
        select *, sum(amount) over (partition by city) ct from orders_flat) group by 1, 2
    compare: {keys: [region, band], values: [v]}
    slayer:
      query: {source_model: orders_flat,
              dimensions: [region, {expression: "CASE WHEN sum(amount, partition_by=city) > 400 THEN 'big' ELSE 'small' END", name: band}],
              measures: [{formula: "sum(amount)", name: v}]}

  - id: X4
    row: Q5
    title: filter on a computed band dimension
    truth_sql: |
      select o.status, 'high', count(*) from orders o
      join (select customer_id, sum(amount) ct from orders group by 1) c on o.customer_id is not distinct from c.customer_id
      where c.ct > 250 group by 1, 2
    compare: {keys: [status, band], values: [v]}
    slayer:
      query: {source_model: orders, filters: ["band = 'high'"],
              dimensions: [status, {expression: "CASE WHEN sum(amount, partition_by=customer_id) > 250 THEN 'high' ELSE 'low' END", name: band}],
              measures: [{formula: "count(*)", name: v}]}

  - id: Q5-cube-sub-query
    row: Q5
    title: "sub_query dimension spend_tier with a source measure orders.revenue (cube-js/cube#12020)"
    truth_sql: |
      with t as (select c.id, sum(o.amount) s from customers c left join orders o on o.customer_id = c.id group by 1)
      select case when t.s > 250 then 'high' else 'low' end, sum(o.amount)
      from customers c join t on t.id = c.id left join orders o on o.customer_id = c.id group by 1
    compare: {keys: [customers_sq.spend_tier], values: [orders.revenue]}
    cube:
      model_declared: true
      schema: [model_declared/sub_query.yml]
      rest: {dimensions: [customers_sq.spend_tier], measures: [orders.revenue]}
      planner_expect:
        tesseract: {known_bug: "https://github.com/cube-js/cube/issues/12020", buggy_error: "Binder Error"}

  - id: Q5-cube-sub-query-count
    row: Q5
    title: "control: the same sub_query dimension with its own cube's count"
    truth_sql: |
      with t as (select c.id, sum(o.amount) s from customers c left join orders o on o.customer_id = c.id group by 1)
      select case when s > 250 then 'high' else 'low' end, count(*) from t group by 1
    compare: {keys: [customers_sq.spend_tier], values: [customers_sq.count]}
    cube:
      model_declared: true
      schema: [model_declared/sub_query.yml]
      rest: {dimensions: [customers_sq.spend_tier], measures: [customers_sq.count]}

  # ------------------------------------------------------------------ Q6 fields from many models, fan-out safe
  - id: Q6a
    row: Q6
    title: sum(customers.credit) by order status broadcasts the grand total (warned)
    truth_sql: select status, (select sum(credit) from customers) from orders group by 1
    compare: {keys: [status], values: [v]}
    slayer:
      query: {source_model: orders, dimensions: [status], measures: [{formula: "sum(customers.credit)", name: v}]}
      expect: {warning: broadcast}
    metricflow:
      note: customers are not reachable from order status without a fan-out join, so the query is refused
      query:
        metrics: [credit_total]
        group_by: [order__status]
      expect: {error: does not match any of the available group-by-items}

  - id: Q6a-assoc
    row: Q6
    title: same with to_many_handling=associate
    truth_sql: |
      select o.status, sum(c.credit) from (select distinct status, customer_id from orders) o
      join customers c on o.customer_id = c.id group by 1
    compare: {keys: [status], values: [v]}
    slayer:
      query: {source_model: orders, dimensions: [status], measures: [{formula: "sum(customers.credit)", name: v}]}
      options: {to_many_handling: associate}
      expect: {warning: associated}
    cube:
      planners: [tesseract]
      rest: {dimensions: [orders.status], measures: [customers.credit_sum, orders.count]}
      keys: [orders.status]
      values: [customers.credit_sum]

  - id: Q6a-error
    row: Q6
    title: same with to_many_handling=error
    slayer:
      query: {source_model: orders, dimensions: [status], measures: [{formula: "sum(customers.credit)", name: v}]}
      options: {to_many_handling: error}
      expect: {error: would broadcast}

  - id: Q6b
