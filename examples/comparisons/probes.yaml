      where r.name in (select r2.name from orders o join customers c2 on o.customer_id = c2.id
                       left join regions r2 on c2.region_id = r2.id) or r.name is null
      group by 1
    compare: {keys: [customers.regions.name], values: [v]}
    slayer:
