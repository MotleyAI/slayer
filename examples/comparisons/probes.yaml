      expect: {error: "Can't detect Cube query"}

  # ------------------------------------------------------------------ Q17 saved measures that compose
  - id: Q17a
    row: Q17
    title: saved measure aov by month
    truth_sql: select date_trunc('month', order_date), sum(amount) / count(*) from orders group by 1
    compare: {keys: [order_date], values: [aov]}
    slayer:
      query: {source_model: orders, time_dimensions: [{dimension: order_date, granularity: month}],
              measures: [{formula: "aov", name: aov}]}
    malloy:
      query: |
        run: orders -> { group_by: m is order_date.month; aggregate: aov }
      keys: [m]
    cube:
      note: SQL API, MEASURE(a) / MEASURE(b)
      sql: select date_trunc('month', order_date) as order_date, measure(revenue) / measure(count) as aov from orders group by 1
    metricflow:
      model_declared: true
      query:
        metrics: [aov]
        group_by: [metric_time__month]
      keys: [metric_time__month]
      values: [aov]

  - id: Q17b
    row: Q17
    title: cumsum(aov)
    truth_sql: |
      with a as (select date_trunc('month', order_date) as month, sum(amount) / count(*) aov from orders group by 1)
      select month, sum(aov) over (order by month) from a
    compare: {keys: [order_date], values: [v]}
    slayer:
      query: {source_model: orders, time_dimensions: [{dimension: order_date, granularity: month}],
              measures: [{formula: "cumsum(aov)", name: v}]}

  - id: Q17c
    row: Q17
    title: saved transform measure aov_chg = change_pct(aov)
    truth_sql: |
      with a as (select date_trunc('month', order_date) as month, sum(amount) / count(*) aov from orders group by 1)
      select x.month, (x.aov - y.aov) / y.aov from a x left join a y on y.month = x.month - interval 1 month
    compare: {keys: [order_date], values: [v]}
    slayer:
      query: {source_model: orders, time_dimensions: [{dimension: order_date, granularity: month}],
              measures: [{formula: "aov_chg", name: v}]}

  - id: Q17d
    row: Q17
    title: arithmetic on a saved measure, aov * 1.1
    truth_sql: select date_trunc('month', order_date), sum(amount) / count(*) * 1.1 from orders group by 1
    compare: {keys: [order_date], values: [v]}
    slayer:
      query: {source_model: orders, time_dimensions: [{dimension: order_date, granularity: month}],
              measures: [{formula: "aov * 1.1", name: v}]}
    malloy:
      note: in calculate; the same expression works under aggregate
      query: |
        run: orders -> { group_by: m is order_date.month; aggregate: aov; calculate: v is aov * 1.1; order_by: m }
      expect: {compile_error: calculate-of-aggregate}
    cube:
      sql: |
        select date_trunc('month', order_date) as order_date, measure(revenue) / measure(count) * 1.1 as v
        from orders group by 1

  - id: Q17-lag-aov
    row: Q17
    title: lag(aov) in calculate
    truth_sql: |
      with a as (select date_trunc('month', order_date) as month, sum(amount) / count(*) aov from orders group by 1)
      select month, lag(aov) over (order by month) from a
    compare: {keys: [m], values: [prev_aov]}
    malloy:
      query: |
        run: orders -> { group_by: m is order_date.month; aggregate: aov; calculate: prev_aov is lag(aov); order_by: m }
    cube:
      sql: |
        select m, lag(aov) over (order by m) as prev_aov
        from (select date_trunc('month', order_date) as m, measure(revenue) / measure(count) as aov from orders group by 1) t

  - id: Q17e
    row: Q17
    title: another model's saved measure, orders.aov from customers by tier
    truth_sql: select c.tier, sum(o.amount) / count(o.id) from customers c join orders o on o.customer_id = c.id group by 1
    compare: {keys: [tier], values: [v]}
    slayer:
      query: {source_model: customers, dimensions: [tier], measures: [{formula: "orders.aov", name: v}]}

  # ------------------------------------------------------------------ Q18 time-bucket safety
