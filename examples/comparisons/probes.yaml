# Semantic-layer probe suite. One entry per probe; every engine's runner reads this and runs its own block.
#
# Probe fields:
#   id, row (feature-matrix row), title
#   truth_sql     hand-written DuckDB SQL on dataset.sql; columns are positional: compare.keys, then compare.values
#   contrast_sql  optional: a plausible answer the engine must NOT return (shows what the semantics rule out)
#   compare       keys, values (engine output column names; SLayer and Cube also match a '.name' suffix),
#                 tolerance (default 1e-6), ordered (default false), columns_exact (output has only keys+values)
#   slayer:       query (dict, or list of stages) or run_by_name (a saved query) + refine, options {to_many_handling,
#                 policy}, extra_models (files in slayer/extra_models/), create_model_from_query, keys/values overrides,
#                 expect: match | {error} | {warning} | {known_bug, buggy_rows, buggy_row_count, buggy_error}
#   malloy:       query (appended to malloy/model.malloy), flatten (nest name), keys/values overrides,
#                 expect: match | {compile_error} | {db_error} | {warning} | {known_bug, buggy_rows, buggy_error, buggy_row_count}
#   cube:         rest (a /load query) or sql (SQL API), planners (default [tesseract, legacy]), model_declared,
#                 schema (extra files layered on cube/model), keys/values overrides, planner_expect {planner: expect},
#                 expect: match | {error} | {known_bug, buggy_rows, buggy_error, buggy_row_count, sql_lacks}
#                 (sql_lacks: the generated SQL must not contain this string)
#   metricflow:   query {metrics, group_by, where, order, limit, start, end, saved_query}, model_declared,
#                 keys/values overrides, note, expect: match | {error} | {known_bug, buggy_rows, buggy_row_count}
# A known_bug is KNOWN-BUG while the buggy signature still reproduces, FIXED once the result matches truth_sql.

slayer_policies:
  north:
    ruleset:
      kind: join
      table: customers
      column: region_id
      value: 1
      joins: [{target_table: orders, join_path: ["orders.customer_id = customers.id"]}]
      whitelist: [regions]

probes:
  # ------------------------------------------------------------------ Q1 coarser grain in the same query
  - id: Q1a
    row: Q1
    title: region total on region x city rows
    truth_sql: |
      select region, city, sum(sum(amount)) over (partition by region) as region_total
      from orders_flat group by 1, 2
    compare: {keys: [region, city], values: [region_total]}
    slayer:
      query: {source_model: orders_flat, dimensions: [region, city],
              measures: [{formula: "sum(amount, partition_by=region)", name: region_total}]}
    malloy:
      query: |
        run: orders_flat -> { group_by: region, city; aggregate: region_total is all(revenue, region) }
    cube:
      sql: select region, city, sum(rev) over (partition by region) as region_total from (select region, city, measure(revenue) as rev from orders_flat group by 1, 2) t

  - id: Q1a-exclude
    row: Q1
    title: exclude(revenue, city) is the region total
    truth_sql: |
      select region, city, sum(sum(amount)) over (partition by region) as region_total
      from orders_flat group by 1, 2
    compare: {keys: [region, city], values: [region_total]}
    malloy:
      query: |
        run: orders_flat -> { group_by: region, city; aggregate: region_total is exclude(revenue, city) }

  - id: Q1a-not-output
    row: Q1
    title: all() over a dimension that is not an output name
    malloy:
      query: |
        run: orders_flat -> { group_by: city; aggregate: t is all(revenue, region) }
      expect: {compile_error: ungroup-field-not-in-output}

  - id: Q1b
    row: Q1
    title: grand total on region x city rows
    truth_sql: |
      select region, city, sum(sum(amount)) over () as grand from orders_flat group by 1, 2
    compare: {keys: [region, city], values: [grand]}
    slayer:
      query: {source_model: orders_flat, dimensions: [region, city],
              measures: [{formula: "sum(amount, partition_by=[])", name: grand}]}
    malloy:
      query: |
        run: orders_flat -> { group_by: region, city; aggregate: grand is all(revenue) }
    cube:
      sql: select region, city, sum(rev) over () as grand from (select region, city, measure(revenue) as rev from orders_flat group by 1, 2) t

  - id: Q1c
    row: Q1
    title: partition by a two-hop dotted path (orders -> customers -> regions)
    truth_sql: |
      select r.name, c.city, sum(sum(o.amount)) over (partition by r.name) as region_total
      from orders o left join customers c on o.customer_id = c.id left join regions r on c.region_id = r.id
      group by 1, 2
    compare: {keys: [region, city], values: [region_total]}
    slayer:
      query: {source_model: orders, dimensions: [customers.regions.name, customers.city],
              measures: [{formula: "sum(amount, partition_by=customers.regions.name)", name: region_total}]}
      keys: [customers.regions.name, customers.city]
    malloy:
      query: |
        run: orders -> { group_by: region, city; aggregate: region_total is all(revenue, region) }

  - id: Q1d
    row: Q1
    title: the coarser total respects a row filter
    truth_sql: |
      select region, city, sum(sum(amount)) over (partition by region) as region_total
      from orders_flat where status = 'ok' group by 1, 2
    compare: {keys: [region, city], values: [region_total]}
    slayer:
      query: {source_model: orders_flat, dimensions: [region, city], filters: ["status = 'ok'"],
              measures: [{formula: "sum(amount, partition_by=region)", name: region_total}]}
    malloy:
      query: |
        run: orders_flat -> { where: status = 'ok'; group_by: region, city; aggregate: region_total is all(revenue, region) }
    cube:
      sql: |
        select region, city, sum(rev) over (partition by region) as region_total
        from (select region, city, measure(revenue) as rev from orders_flat where status = 'ok' group by 1, 2) t

  - id: Q1e
    row: Q1
    title: a HAVING filter does not change the parent total
    truth_sql: |
      select region, city, t as region_total from (
        select region, city, sum(amount) s, sum(sum(amount)) over (partition by region) t
        from orders_flat group by 1, 2) where s > 250
    compare: {keys: [region, city], values: [region_total]}
    slayer:
      query: {source_model: orders_flat, dimensions: [region, city], filters: ["sum(amount) > 250"],
              measures: [{formula: "sum(amount)", name: revenue},
                         {formula: "sum(amount, partition_by=region)", name: region_total}]}
    malloy:
      query: |
        run: orders_flat -> { group_by: region, city; aggregate: revenue, region_total is all(revenue, region); having: revenue > 250 }

  - id: Q1f
    row: Q1
    title: a limit does not change the grand total
    truth_sql: |
      select region, city, t as grand from (
        select region, city, sum(amount) s, sum(sum(amount)) over () t from orders_flat group by 1, 2)
      order by s desc limit 2
    compare: {keys: [region, city], values: [grand]}
    slayer:
      query: {source_model: orders_flat, dimensions: [region, city], limit: 2,
              order: [{column: "sum(amount)", direction: desc}],
              measures: [{formula: "sum(amount)", name: revenue}, {formula: "sum(amount, partition_by=[])", name: grand}]}
    malloy:
      query: |
        run: orders_flat -> { group_by: region, city; aggregate: revenue, grand is all(revenue); order_by: revenue desc; limit: 2 }

  - id: S1
    row: Q1
    title: "smoke: bare-string measures by a two-hop dimension"
    truth_sql: select region, sum(amount), count(*) from orders_flat group by 1
    compare: {keys: [customers.regions.name], values: [amount_sum, _count]}
    slayer:
      query: {source_model: orders, dimensions: [customers.regions.name], measures: ["sum(amount)", "count(*)"]}
    metricflow:
      query:
        metrics: [revenue, order_count]
        group_by: [customer__region__name]
      keys: [customer__region__name]
      values: [revenue, order_count]

  - id: S3
    row: Q1
    title: "smoke: bare-string partitioned measure"
    truth_sql: |
      select region, city, sum(amount), sum(sum(amount)) over (partition by region) from orders_flat group by 1, 2
    compare: {keys: [region, city], values: [amount_sum, amount_sum_partition_by_region]}
    slayer:
      query: {source_model: orders_flat, dimensions: [region, city],
              measures: ["sum(amount)", "sum(amount, partition_by=region)"]}

  - id: Q1-cube-keep-only
    row: Q1
    title: "multi-stage grain: keep_only [region] on region x city rows"
    truth_sql: |
      select region, city, sum(sum(amount)) over (partition by region) as region_total
      from orders_flat group by 1, 2
    compare: {keys: [region, city], values: [region_total]}
    cube:
      model_declared: true
      schema: [model_declared/multi_stage.yml]
      rest: {dimensions: [orders_ms.region, orders_ms.city], measures: [orders_ms.region_total]}
      keys: [orders_ms.region, orders_ms.city]
      values: [orders_ms.region_total]
      planner_expect:
        legacy: {known_bug: "legacy planner silently ignores grain: https://github.com/cube-js/cube/issues/12025", buggy_rows: [[North, Bergen, 335]]}

  # ------------------------------------------------------------------ Q2 arithmetic across grains
  - id: Q2a
    row: Q2
    title: each city's share of its region
    truth_sql: |
      select region, city, sum(amount) / sum(sum(amount)) over (partition by region) as share
      from orders_flat group by 1, 2
    compare: {keys: [region, city], values: [share]}
    slayer:
      query: {source_model: orders_flat, dimensions: [region, city],
              measures: [{formula: "sum(amount) / sum(amount, partition_by=region)", name: share}]}
    malloy:
      query: |
        run: orders_flat -> { group_by: region, city; aggregate: share is revenue / all(revenue, region) }
    cube:
      sql: select region, city, rev / sum(rev) over (partition by region) as share from (select region, city, measure(revenue) as rev from orders_flat group by 1, 2) t

  - id: Q2a-total
    row: Q2
    title: each city's share of the grand total
    truth_sql: |
      select region, city, sum(amount) / sum(sum(amount)) over () as share from orders_flat group by 1, 2
    compare: {keys: [region, city], values: [share]}
    slayer:
      query: {source_model: orders_flat, dimensions: [region, city],
              measures: [{formula: "sum(amount) / sum(amount, partition_by=[])", name: share}]}
    malloy:
      query: |
        run: orders_flat -> { group_by: region, city; aggregate: share is revenue / all(revenue) }
    cube:
      sql: select region, city, rev / sum(rev) over () as share from (select region, city, measure(revenue) as rev from orders_flat group by 1, 2) t

  - id: Q2a-filtered
    row: Q2
    title: share of a filtered grand total, all(revenue { where })
    truth_sql: |
      select region, city, sum(amount) / (select sum(amount) from orders_flat where status = 'ok') as share
      from orders_flat group by 1, 2
    compare: {keys: [region, city], values: [share]}
    malloy:
      query: |
        run: orders_flat -> { group_by: region, city; aggregate: share is revenue / all(revenue { where: status = 'ok' }) }

  - id: Q2b
    row: Q2
    title: region total minus city total (Oslo spans two regions)
    truth_sql: |
      select region, city, sum(sum(amount)) over (partition by region) - sum(sum(amount)) over (partition by city) as d
      from orders_flat group by 1, 2
    compare: {keys: [region, city], values: [d]}
    slayer:
      query: {source_model: orders_flat, dimensions: [region, city],
              measures: [{formula: "sum(amount, partition_by=region) - sum(amount, partition_by=city)", name: d}]}
    malloy:
      query: |
        run: orders_flat -> { group_by: region, city; aggregate: d is all(revenue, region) - all(revenue, city) }

  - id: Q2c
    row: Q2
    title: rank over a mixed-grain expression
    truth_sql: |
      select region, city, rank() over (order by d desc) as rk from (
        select region, city, sum(sum(amount)) over (partition by region) - sum(sum(amount)) over (partition by city) d
        from orders_flat group by 1, 2)
    compare: {keys: [region, city], values: [rk]}
    slayer:
      query: {source_model: orders_flat, dimensions: [region, city],
              measures: [{formula: "rank(sum(amount, partition_by=region) - sum(amount, partition_by=city))", name: rk}]}

  - id: F4
    row: Q2
    title: a bare finer-grain aggregate (partition_by=city, dims [region]) is rejected
    slayer:
      query: {source_model: orders_flat, dimensions: [region],
              measures: [{formula: "sum(amount, partition_by=city)", name: v}]}
      expect: {error: PartitionKeyError}

  - id: F5
    row: Q2
    title: finer-grain aggregate in arithmetic is rejected
    slayer:
      query: {source_model: orders_flat, dimensions: [region],
              measures: [{formula: "sum(amount, partition_by=city) / sum(amount)", name: v}]}
      expect: {error: PartitionKeyError}

  - id: F5b
    row: Q2
    title: cumsum over a finer-grain aggregate is rejected
    slayer:
      query: {source_model: orders_flat, dimensions: [region],
              time_dimensions: [{dimension: order_date, granularity: month}],
              measures: [{formula: "cumsum(sum(amount, partition_by=city))", name: v}]}
      expect: {error: PartitionKeyError}

  - id: F10
    row: Q2
    title: filter on a finer-grain aggregate is rejected
    slayer:
      query: {source_model: orders_flat, dimensions: [region], filters: ["sum(amount, partition_by=city) > 300"],
              measures: [{formula: "sum(amount)", name: v}]}
      expect: {error: PartitionKeyError}

  - id: F11
    row: Q2
    title: order by a finer-grain aggregate is rejected
    slayer:
      query: {source_model: orders_flat, dimensions: [region],
              order: [{column: "sum(amount, partition_by=city)", direction: desc}],
              measures: [{formula: "sum(amount)", name: v}]}
      expect: {error: PartitionKeyError}

  - id: F13
    row: Q2
    title: time_shift of an aggregate partitioned by a non-dimension is rejected
    slayer:
      query: {source_model: orders_flat, dimensions: [region],
              time_dimensions: [{dimension: order_date, granularity: month}],
              measures: [{formula: "time_shift(sum(amount, partition_by=[city, region, order_date]), -1)", name: v}]}
      expect: {error: PartitionKeyError}

  - id: X5
    row: Q2
    title: share of grand total by region, NULL region included
    truth_sql: select region, sum(amount) / (select sum(amount) from orders) from orders_flat group by 1
    compare: {keys: [customers.regions.name], values: [share]}
    slayer:
      query: {source_model: orders, dimensions: [customers.regions.name],
              measures: [{formula: "sum(amount) / sum(amount, partition_by=[])", name: share}]}

  - id: Q2-cube-share-of-region
    row: Q2
    title: "multi-stage share_of_region = revenue / region_total"
    truth_sql: |
      select region, city, sum(amount) / sum(sum(amount)) over (partition by region) as share
      from orders_flat group by 1, 2
    compare: {keys: [region, city], values: [share]}
    cube:
      model_declared: true
      schema: [model_declared/multi_stage.yml]
      rest: {dimensions: [orders_ms.region, orders_ms.city], measures: [orders_ms.share_of_region]}
      keys: [orders_ms.region, orders_ms.city]
      values: [orders_ms.share_of_region]
      planner_expect:
        legacy: {known_bug: "legacy planner silently ignores grain: https://github.com/cube-js/cube/issues/12025", buggy_rows: [[North, Bergen, 1]]}

  # ------------------------------------------------------------------ Q3 re-aggregation
  - id: Q3a
    row: Q3
    title: per region, unweighted average of city totals
    truth_sql: |
      select region, avg(s) as avg_city from (select region, city, sum(amount) s from orders_flat group by 1, 2) group by 1
    compare: {keys: [region], values: [avg_city]}
    slayer:
      query: {source_model: orders_flat, dimensions: [region],
              measures: [{formula: "avg(sum(amount, partition_by=[city, region]))", name: avg_city}]}
    malloy:
      note: two-stage pipeline; a single stage is aggregate-of-aggregate (Q3a-one-stage)
      query: |
        run: orders_flat -> { group_by: region, city; aggregate: revenue } -> { group_by: region; aggregate: avg_city is revenue.avg() }
    cube:
      sql: select region, avg(rev) as avg_city from (select region, city, measure(revenue) as rev from orders_flat group by 1, 2) t group by 1

  - id: Q3a-one-stage
    row: Q3
    title: avg() over a measure in one stage
    malloy:
      query: |
        run: orders_flat -> { group_by: region; aggregate: a is avg(revenue) }
      expect: {compile_error: aggregate-of-aggregate}

  - id: F1b
    row: Q3
    title: count of city cells per region
    truth_sql: |
      select region, count(s) from (select region, city, sum(amount) s from orders_flat group by 1, 2) group by 1
    compare: {keys: [region], values: [v]}
    slayer:
      query: {source_model: orders_flat, dimensions: [region],
              measures: [{formula: "count(sum(amount, partition_by=[city, region]))", name: v}]}

  - id: F1c
    row: Q3
    title: largest customer total per region
    truth_sql: |
      select region, max(s) from (select region, customer_id, sum(amount) s from orders_flat group by 1, 2) group by 1
    compare: {keys: [region], values: [v]}
    slayer:
      query: {source_model: orders_flat, dimensions: [region],
              measures: [{formula: "max(sum(amount, partition_by=[customer_id, region]))", name: v}]}

  - id: F2
    row: Q3
    title: row-level expression weighted by a city average (city not a dimension)
    truth_sql: |
      select region, sum(amount * ca) from (
        select region, amount, avg(amount) over (partition by city) ca from orders_flat) group by 1
    compare: {keys: [region], values: [v]}
    slayer:
      query: {source_model: orders_flat, dimensions: [region],
              measures: [{formula: "sum(amount * avg(amount, partition_by=city))", name: v}]}

  - id: F2b
    row: Q3
    title: same across a join (partition_by=customers.city)
    truth_sql: |
      select region, sum(amount * ca) from (
        select region, amount, avg(amount) over (partition by city) ca from orders_flat) group by 1
    compare: {keys: [customers.regions.name], values: [v]}
    slayer:
      query: {source_model: orders, dimensions: [customers.regions.name],
              measures: [{formula: "sum(amount * avg(amount, partition_by=customers.city))", name: v}]}

  - id: F3
    row: Q3
    title: weighted_avg with a city-total weight
    truth_sql: |
      select region, sum(amount * w) / sum(w) from (
        select region, amount, sum(amount) over (partition by city) w from orders_flat) group by 1
    compare: {keys: [region], values: [v]}
    slayer:
      query: {source_model: orders_flat, dimensions: [region],
              measures: [{formula: "weighted_avg(amount, weight=sum(amount, partition_by=city))", name: v}]}

  - id: F7
    row: Q3
    title: max of customer totals by a two-hop region (customer_id -> region provable)
    truth_sql: |
      select region, max(s) from (select region, customer_id, sum(amount) s from orders_flat group by 1, 2) group by 1
    compare: {keys: [customers.regions.name], values: [v]}
    slayer:
      query: {source_model: orders, dimensions: [customers.regions.name],
              measures: [{formula: "max(sum(amount, partition_by=customer_id))", name: v}]}

  - id: F9
    row: Q3
    title: month(order_date) inside partition_by is not supported
    slayer:
      query: {source_model: orders_flat, dimensions: [region],
              time_dimensions: [{dimension: order_date, granularity: year}],
              measures: [{formula: "avg(sum(amount, partition_by=[region, month(order_date)]))", name: v}]}
      expect: {error: PartitionKeyError}

  - id: F9b
    row: Q3
    title: partition_by=[region, order_date] under a year time dimension is the year bucket
    truth_sql: |
      select region, date_trunc('year', order_date), sum(amount) from orders_flat group by 1, 2
    compare: {keys: [region, order_date], values: [v]}
    slayer:
      query: {source_model: orders_flat, dimensions: [region],
              time_dimensions: [{dimension: order_date, granularity: year}],
              measures: [{formula: "avg(sum(amount, partition_by=[region, order_date]))", name: v}]}
      expect: {warning: degenerate_reaggregation}

  - id: F9c
    row: Q3
    title: average of per-day region totals (no time dimension)
    truth_sql: |
      select region, avg(s) from (select region, order_date, sum(amount) s from orders_flat group by 1, 2) group by 1
    compare: {keys: [region], values: [v]}
    slayer:
      query: {source_model: orders_flat, dimensions: [region],
              measures: [{formula: "avg(sum(amount, partition_by=[region, order_date]))", name: v}]}

  - id: F9d
    row: Q3
    title: month cells via an inline order_month column under a year dimension broadcast (warned)
    note: order_month is not linked to the year bucket, so each region's all-years value is repeated per year
    truth_sql: |
      with c as (select region, date_trunc('month', order_date) m, sum(amount) s from orders_flat group by 1, 2),
           y as (select distinct region, date_trunc('year', order_date) yr from orders_flat)
      select y.region, y.yr, (select avg(s) from c where c.region is not distinct from y.region) from y
    compare: {keys: [region, order_date], values: [v]}
    slayer:
      query: {source_model: {source_name: orders_flat,
                             columns: [{name: order_month, sql: "date_trunc('month', order_date)", type: date}]},
              dimensions: [region], time_dimensions: [{dimension: order_date, granularity: year}],
              measures: [{formula: "avg(sum(amount, partition_by=[region, order_month]))", name: v}]}
      expect: {warning: broadcast}

  - id: F9e
    row: Q3
    title: average monthly total per region-year via partition_by=[region, order_month, order_date]
    truth_sql: |
      select region, date_trunc('year', m), avg(s) from (
        select region, date_trunc('month', order_date) m, sum(amount) s from orders_flat group by 1, 2) group by 1, 2
    compare: {keys: [region, order_date], values: [v]}
    slayer:
      query: {source_model: {source_name: orders_flat,
                             columns: [{name: order_month, sql: "date_trunc('month', order_date)", type: date}]},
              dimensions: [region], time_dimensions: [{dimension: order_date, granularity: year}],
              measures: [{formula: "avg(sum(amount, partition_by=[region, order_month, order_date]))", name: v}]}

  - id: F9f
    row: Q3
    title: same via two stages (month stage, then year re-bucket)
    truth_sql: |
      select region, date_trunc('year', m), avg(s) from (
        select region, date_trunc('month', order_date) m, sum(amount) s from orders_flat group by 1, 2) group by 1, 2
    compare: {keys: [region, order_date], values: [v]}
    slayer:
      query:
        - {name: mstage, source_model: orders_flat, dimensions: [region],
           time_dimensions: [{dimension: order_date, granularity: month}], measures: [{formula: "sum(amount)", name: s}]}
        - {source_model: mstage, dimensions: [region], time_dimensions: [{dimension: order_date, granularity: year}],
           measures: [{formula: "avg(s)", name: v}]}

  - id: X6
    row: Q3
    title: median(amount) by status
    truth_sql: select status, median(amount) from orders group by 1
    compare: {keys: [status], values: [v]}
    slayer:
      query: {source_model: orders, dimensions: [status], measures: [{formula: "median(amount)", name: v}]}
    cube:
      model_declared: true
      schema: [model_declared/multi_stage.yml]
      note: a multi-stage number_agg measure, MEDIAN({amount}) with grain include [id, amount]
      rest: {dimensions: [orders_ms.status], measures: [orders_ms.median_amount_by_id]}
      keys: [orders_ms.status]
      values: [orders_ms.median_amount_by_id]
      planner_expect:
        legacy: {error: "Scalar Function with name numberagg does not exist"}

  - id: Q3-cube-grain-include
    row: Q3
    title: "multi-stage grain: include [city] avg, per region"
    truth_sql: |
      select region, avg(s) as avg_city from (select region, city, sum(amount) s from orders_flat group by 1, 2) group by 1
    compare: {keys: [region], values: [avg_city]}
    cube:
      model_declared: true
      schema: [model_declared/multi_stage.yml]
      rest: {dimensions: [orders_ms.region], measures: [orders_ms.avg_city_revenue]}
      keys: [orders_ms.region]
      values: [orders_ms.avg_city_revenue]
      planner_expect:
        legacy: {known_bug: "legacy planner silently ignores grain: https://github.com/cube-js/cube/issues/12025", buggy_rows: [[North, 705]]}

  - id: Q3-cube-avg-of-avg
    row: Q3
    title: "pitfall: AVG() over a nested avg measure is an average of averages"
    note: post-processing re-aggregates the inner rows; a non-additive measure does not survive it
    truth_sql: |
      select region, avg(a) from (select region, city, avg(amount) a from orders_flat group by 1, 2) group by 1
    contrast_sql: select region, avg(amount) from orders_flat group by 1
    compare: {keys: [region], values: [v]}
    cube:
      sql: |
        select region, avg(a) as v from (select region, city, measure(avg_amount) as a from orders_flat group by 1, 2) t group by 1

  - id: Q3-cube-sum-of-distinct
    row: Q3
    title: "pitfall: SUM() over nested per-status distinct counts double-counts customers"
    truth_sql: |
      select region, sum(c) from (select region, status, count(distinct customer_id) c from orders_flat group by 1, 2) group by 1
    contrast_sql: select region, count(distinct customer_id) from orders_flat group by 1
    compare: {keys: [region], values: [v]}
    cube:
      sql: |
        select region, sum(c) as v from (select region, status, measure(customer_count) as c from orders_flat group by 1, 2) t group by 1

  - id: Q3-cube-sum-of-avg-measure
    row: Q3
    title: SUM() over an avg measure silently becomes SUM() of its column
    note: no error or warning; the aggregate named in the query replaces the measure's own
    truth_sql: select region, sum(amount) from orders_flat group by 1
    contrast_sql: select region, avg(amount) from orders_flat group by 1
    compare: {keys: [region], values: [v]}
    cube:
      sql: select region, sum(avg_amount) as v from orders_flat group by 1

  - id: Q3-cube-number-agg-plain
    row: Q3
    title: "number_agg without multi_stage is rejected by the schema validator"
    note: >-
      the docs list number_agg as a plain measure type ("Custom aggregate ... Tesseract only") and the Tesseract
      planner classifies it as a built-in aggregation, but the validator only allows it on multi_stage measures
    cube:
      model_declared: true
      schema: [model_declared/number_agg_plain.yml]
      rest: {measures: [orders_agg.max_amount_agg]}
      expect: {known_bug: "validator rejects a non-multi-stage number_agg: https://github.com/cube-js/cube/issues/12024",
               buggy_error: "must be one of [count, number, string, boolean, time, sum, avg, min, max, countDistinct, countDistinctApprox]"}

  - id: Q3-cube-number-agg-ms-column
    row: Q3
    title: "multi-stage number_agg over a raw column, MAX({CUBE}.amount), is rejected at query time"
    cube:
      model_declared: true
      schema: [model_declared/multi_stage.yml]
      rest: {dimensions: [orders_ms.status], measures: [orders_ms.max_amount_agg]}
      expect: {error: "Multi stage members can only reference other members"}
      planner_expect:
        legacy: {error: "Scalar Function with name numberagg does not exist"}

  - id: Q3-cube-number-agg-ms-grain
    row: Q3
    title: "multi-stage number_agg MEDIAN({amount}) without amount in its grain is rejected"
    cube:
      model_declared: true
      schema: [model_declared/multi_stage.yml]
      rest: {dimensions: [orders_ms.status], measures: [orders_ms.median_amount_agg]}
      expect: {error: "which is not part of the grain"}
      planner_expect:
        legacy: {error: "Scalar Function with name numberagg does not exist"}

  # ------------------------------------------------------------------ Q4 transforms and time shift
  - id: Q4a
    row: Q4
    title: last year's revenue for 2025Q1 months (the date range must not clip the lookback)
    truth_sql: |
      with m as (select date_trunc('month', order_date) as month, sum(amount) as rev from orders group by 1)
      select a.month, b.rev from m a left join m b on b.month = a.month - interval 12 month
      where a.month between date '2025-01-01' and date '2025-03-31'
    compare: {keys: [order_date], values: [prev_year]}
    slayer:
      query: {source_model: orders,
              time_dimensions: [{dimension: order_date, granularity: month, date_range: ["2025-01-01", "2025-03-31"]}],
              measures: [{formula: "time_shift(sum(amount), -1, 'year')", name: prev_year}]}
    malloy:
      note: workaround, a self-join on a query source with m - 12 months
      query: |
        query: monthly is orders -> { group_by: m is order_date.month; aggregate: revenue }
        source: monthly_src is monthly extend { join_one: prior is monthly on prior.m = m - 12 months }
        run: monthly_src -> { where: m >= @2025-01-01 and m < @2025-04-01; group_by: m; aggregate: prev_year is prior.revenue.sum() }
      keys: [m]
    cube:
      model_declared: true
      schema: [model_declared/multi_stage.yml]
      note: time_shift prior 1 year; the date range does not clip the lookback
      rest: {measures: [orders_ms.revenue_prior_year],
             timeDimensions: [{dimension: orders_ms.order_date, granularity: month, dateRange: ["2025-01-01", "2025-03-31"]}]}
      keys: [orders_ms.order_date.month]
      values: [orders_ms.revenue_prior_year]
    metricflow:
      model_declared: true
      query:
        metrics: [revenue_prev_year]
        group_by: [metric_time__month]
        start: '2025-01-01'
        end: '2025-03-31'
      keys: [metric_time__month]
      values: [revenue_prev_year]

  - id: Q4a2
    row: Q4
    title: same with an explicit date filter instead of date_range
    truth_sql: |
      with m as (select date_trunc('month', order_date) as month, sum(amount) as rev from orders group by 1)
      select a.month, b.rev from m a left join m b on b.month = a.month - interval 12 month
      where a.month between date '2025-01-01' and date '2025-03-31'
    compare: {keys: [order_date], values: [prev_year]}
    slayer:
      query: {source_model: orders, time_dimensions: [{dimension: order_date, granularity: month}],
              filters: ["order_date >= '2025-01-01' and order_date <= '2025-03-31'"],
              measures: [{formula: "time_shift(sum(amount), -1, 'year')", name: prev_year}]}
    metricflow:
      model_declared: true
      query:
        metrics: [revenue_prev_year]
        group_by: [metric_time__month]
        where: ['{{ TimeDimension(''metric_time'', ''month'') }} >= ''2025-01-01'' AND {{ TimeDimension(''metric_time'', ''month'')
            }} <= ''2025-03-31''']
      keys: [metric_time__month]
      values: [revenue_prev_year]

  - id: Q4b
    row: Q4
    title: year-ago value for 2025-04..06, where the year-ago months are empty (NULL)
    truth_sql: |
      with m as (select date_trunc('month', order_date) as month, sum(amount) as rev from orders group by 1)
      select a.month, b.rev from m a left join m b on b.month = a.month - interval 12 month
      where a.month between date '2025-04-01' and date '2025-06-30'
