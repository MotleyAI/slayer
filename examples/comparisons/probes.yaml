              time_dimensions: [{dimension: order_date, granularity: month, date_range: ["2025-04-01", "2025-06-30"]}],
              measures: [{formula: "time_shift(sum(amount), -1, 'year')", name: prev_year}]}

  - id: Q4c
    row: Q4
    title: change() is calendar-aware across month gaps
    truth_sql: |
      with m as (select date_trunc('month', order_date) as month, sum(amount) as rev from orders group by 1)
      select a.month, a.rev - b.rev from m a left join m b on b.month = a.month - interval 1 month
    compare: {keys: [order_date], values: [v]}
    slayer:
      query: {source_model: orders, time_dimensions: [{dimension: order_date, granularity: month}],
              measures: [{formula: "change(sum(amount))", name: v}]}

  - id: Q4d
    row: Q4
    title: change_pct()
    truth_sql: |
      with m as (select date_trunc('month', order_date) as month, sum(amount) as rev from orders group by 1)
      select a.month, (a.rev - b.rev) / b.rev from m a left join m b on b.month = a.month - interval 1 month
    compare: {keys: [order_date], values: [v]}
    slayer:
      query: {source_model: orders, time_dimensions: [{dimension: order_date, granularity: month}],
              measures: [{formula: "change_pct(sum(amount))", name: v}]}

  - id: Q4e
    row: Q4
    title: running total (cumsum / sum_cumulative)
    truth_sql: |
      with m as (select date_trunc('month', order_date) as month, sum(amount) as rev from orders group by 1)
      select month, sum(rev) over (order by month) from m
    compare: {keys: [order_date], values: [cum]}
    slayer:
      query: {source_model: orders, time_dimensions: [{dimension: order_date, granularity: month}],
              measures: [{formula: "cumsum(sum(amount))", name: cum}]}
    malloy:
      query: |
        run: orders -> { group_by: m is order_date.month; aggregate: revenue; calculate: cum is sum_cumulative(revenue); order_by: m }
      keys: [m]

  - id: Q4f
    row: Q4
    title: lag is row-based in both (2024-12's previous value is 2024-03)
    truth_sql: |
      with m as (select date_trunc('month', order_date) as month, sum(amount) as rev from orders group by 1)
      select month, lag(rev) over (order by month) from m
    contrast_sql: |
      with m as (select date_trunc('month', order_date) as month, sum(amount) as rev from orders group by 1)
      select a.month, b.rev from m a left join m b on b.month = a.month - interval 1 month
    compare: {keys: [order_date], values: [prev]}
    slayer:
      query: {source_model: orders, time_dimensions: [{dimension: order_date, granularity: month}],
              measures: [{formula: "lag(sum(amount), 1)", name: prev}]}
    malloy:
      query: |
        run: orders -> { group_by: m is order_date.month; aggregate: revenue; calculate: prev is lag(revenue); order_by: m }
      keys: [m]
    cube:
      note: SQL API, LAG() in an outer query over a nested monthly semantic query
      sql: select order_date, lag(rev) over (order by order_date) as prev from (select date_trunc('month', order_date) as order_date, measure(revenue) as rev from orders group by 1) t

  - id: Q4f2
    row: Q4
    title: lead(sum, 1)
    truth_sql: |
      with m as (select date_trunc('month', order_date) as month, sum(amount) as rev from orders group by 1)
      select month, lead(rev) over (order by month) from m
    compare: {keys: [order_date], values: [v]}
    slayer:
      query: {source_model: orders, time_dimensions: [{dimension: order_date, granularity: month}],
              measures: [{formula: "lead(sum(amount), 1)", name: v}]}

  - id: Q4f-where
    row: Q4
    title: a where clips lag's input (2025-01 gets no previous value)
    truth_sql: |
      with m as (select date_trunc('month', order_date) as month, sum(amount) as rev from orders
                 where order_date >= date '2025-01-01' group by 1)
      select month, lag(rev) over (order by month) from m
    contrast_sql: |
      with m as (select date_trunc('month', order_date) as month, sum(amount) as rev from orders group by 1)
      select month, prev from (select month, lag(rev) over (order by month) prev from m) where month >= date '2025-01-01'
    compare: {keys: [m], values: [prev]}
    malloy:
      query: |
        run: orders -> { where: order_date >= @2025-01-01; group_by: m is order_date.month; aggregate: revenue; calculate: prev is lag(revenue); order_by: m }

  - id: Q4f-later-stage
    row: Q4
    title: workaround, lag first and filter in a later stage
    truth_sql: |
      with m as (select date_trunc('month', order_date) as month, sum(amount) as rev from orders group by 1)
      select month, prev from (select month, lag(rev) over (order by month) prev from m) where month >= date '2025-01-01'
    compare: {keys: [m], values: [prev]}
    malloy:
      query: |
        run: orders -> { group_by: m is order_date.month; aggregate: revenue; calculate: prev is lag(revenue); order_by: m }
          -> { where: m >= @2025-01-01; select: m, prev; order_by: m }

  - id: Q4-filtered-escape
    row: Q4
    title: "a filtered aggregate { where: @2024 } cannot escape a query-level where @2025 (returns 0)"
    note: the two filters are ANDed, so the 2024 column is always empty
    truth_sql: |
      select (select sum(amount) from orders where year(order_date) = 2025) as rev_2025,
             (select coalesce(sum(amount), 0) from orders where year(order_date) = 2025 and year(order_date) = 2024) as rev_2024
    contrast_sql: |
      select (select sum(amount) from orders where year(order_date) = 2025),
             (select sum(amount) from orders where year(order_date) = 2024)
    compare: {values: [rev_2025, rev_2024]}
    malloy:
      query: |
        run: orders -> { where: order_date ? @2025; aggregate: rev_2025 is revenue, rev_2024 is revenue { where: order_date ? @2024 } }

