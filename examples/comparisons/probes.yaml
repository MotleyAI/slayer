    compare: {keys: [status], values: [n_customers, net]}
    malloy:
      query: |
        run: orders -> { group_by: status; aggregate: n_customers is customers.count(), net is source.sum(amount * (1 - customers.discount)) }

  - id: Q6-multihop
    row: Q6
    title: three-level join regions -> customers -> orders (East empty)
    truth_sql: |
      select r.name, coalesce(sum(o.amount), 0), count(o.id), count(distinct c.id)
      from regions r left join customers c on c.region_id = r.id left join orders o on o.customer_id = c.id group by 1
    compare: {keys: [name], values: [rev, n, nc]}
    malloy:
      query: |
        source: regions3 is regions extend { join_many: customers is customers on customers.region_id = id }
        run: regions3 -> { group_by: name; aggregate: rev is customers.orders.amount.sum(), n is count(customers.orders.id), nc is customers.count() }

  - id: X1
    row: Q6
    title: from regions, multi-hop to-many sum and counts (East must be NULL / 0 / 0)
    truth_sql: |
