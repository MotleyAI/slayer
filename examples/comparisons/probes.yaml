    compare: {keys: [customers.regions.name], values: [v]}
    slayer:
      query: {source_model: orders, dimensions: [customers.regions.name],
              measures: [{formula: "sum(amount)", name: revenue}, {formula: "avg(customers.credit)", name: v}]}

  - id: Q6-locality
    row: Q6
    title: locality aggregates customers.count() and source.sum(amount * (1 - customers.discount))
    truth_sql: |
