      rest: {dimensions: [orders.status], measures: [customers.credit_raw_sum, orders.count]}
  - id: Q6-cube-region
    row: Q6
    title: credit sum and order count by region, fan-out safe (East NULL / 0; Eve's NULL region dropped)
    truth_sql: |
