    contrast_sql: select count(*) from orders where order_date = date '2024-01-20'
    compare: {values: [order_count]}
    malloy:
      query: |
        run: orders extend { dimension: mm is order_date.month } -> { where: mm.day = @2024-01-20; aggregate: order_count }

  - id: Q18-malloy-year
    row: Q18
    title: "control: m.year (coarser) is fine"
