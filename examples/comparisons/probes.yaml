      from regions r left join customers c on c.region_id = r.id left join orders o on o.customer_id = c.id group by 1
    compare: {keys: [name], values: [rev, n_orders, n_customers]}
    slayer:
      query: {source_model: regions, dimensions: [name],
              measures: [{formula: "sum(customers.orders.amount)", name: rev},
                         {formula: "count(customers.orders.id)", name: n_orders},
