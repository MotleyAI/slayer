    title: FROM orders CROSS JOIN customers roots at orders, matching legacy REST
    truth_sql: |
      select c.tier, o.status, sum(o.amount) from orders o left join customers c on o.customer_id = c.id group by 1, 2
    compare: {keys: [tier, status], values: [revenue]}
    cube:
