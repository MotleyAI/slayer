        run: orders extend { dimension: mm is order_date.month } -> { group_by: y is mm.year; aggregate: order_count }

  - id: Q18b
    row: Q18
    title: a week breakdown of a month-truncated column
    slayer:
      query: {source_model: monthly_rev, time_dimensions: [{dimension: order_date, granularity: week}],
