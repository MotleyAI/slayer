        select customers.tier as tier, orders.status as status, measure(orders.revenue) as revenue
        from orders cross join customers group by 1, 2
  # ------------------------------------------------------------------ Q20 relative date ranges (Cube)
  - id: Q20-cube-days-ago
    row: Q20
    title: "dateRange 'from 500 days ago to now' (truth relative to today, UTC)"
    note: Core has no query-level anchor for now, so the truth moves with the clock too
    truth_sql: |
      select sum(amount) from orders where order_date >= timezone('UTC', now())::date - interval 500 day
    compare: {values: [orders.revenue]}
    cube:
      rest: {measures: [orders.revenue], timeDimensions: [{dimension: orders.order_date, dateRange: from 500 days ago to now}]}

  - id: Q20-cube-last-years
    row: Q20
    title: "dateRange 'last 2 years' by month means the two previous calendar years"
    truth_sql: |
      select date_trunc('month', order_date), sum(amount) from orders
      where year(order_date) between year(timezone('UTC', now())) - 2 and year(timezone('UTC', now())) - 1 group by 1
    compare: {keys: [orders.order_date.month], values: [orders.revenue]}
    cube:
      rest: {measures: [orders.revenue],
             timeDimensions: [{dimension: orders.order_date, granularity: month, dateRange: last 2 years}]}

  # ------------------------------------------------------------------ Q21 time zones and calendar parts (Cube)
  - id: Q21-cube-timezone
    row: Q21
    title: "timezone America/Los_Angeles moves every DATE back a day (read as UTC midnight; https://github.com/cube-js/cube/issues/10166)"
    truth_sql: |
      select order_date - interval 1 day, count(*) from orders
      where order_date > date '2024-01-01' and order_date <= date '2024-02-01' group by 1
    contrast_sql: |
      select order_date, count(*) from orders where order_date between date '2024-01-01' and date '2024-01-31' group by 1
    compare: {keys: [orders.order_date.day], values: [orders.count]}
    cube:
      rest: {measures: [orders.count], timezone: America/Los_Angeles,
             timeDimensions: [{dimension: orders.order_date, granularity: day, dateRange: ["2024-01-01", "2024-01-31"]}]}

  - id: Q21-cube-day-of-week
    row: Q21
    title: there is no day_of_week granularity
    cube:
      rest: {measures: [orders.revenue], timeDimensions: [{dimension: orders.order_date, granularity: day_of_week}]}
      expect: {error: "Granularity \"day_of_week\" does not exist"}

  # ------------------------------------------------------------------ C1 nested results
  - id: C1
    row: C1
    title: per region, a nested table of the top two customers
    truth_sql: |
      with cr as (select f.region, c.name, sum(f.amount) s from orders_flat f left join customers c on f.customer_id = c.id group by 1, 2),
           rt as (select region, sum(amount) t from orders_flat group by 1)
      select cr.region, cr.name, rt.t, cr.s from (
        select *, row_number() over (partition by region order by s desc) rn from cr) cr
      join rt on rt.region is not distinct from cr.region where rn <= 2
    compare: {keys: [region, by_customer.name], values: [revenue, by_customer.revenue]}
    malloy:
      query: |
        run: orders -> { group_by: region; aggregate: revenue; nest: by_customer is { group_by: name is customers.name; aggregate: revenue; limit: 2 } }
      flatten: by_customer

  # ------------------------------------------------------------------ C5 row-level security (SLayer)
  - id: C5a
    row: C5
    title: orders count and sum scoped to the North tenant
    truth_sql: select count(*), sum(amount) from orders o join customers c on o.customer_id = c.id where c.region_id = 1
    compare: {values: [n, rev]}
    slayer:
      query: {source_model: orders, measures: [{formula: "count(*)", name: n}, {formula: "sum(amount)", name: rev}]}
      options: {policy: north}

  - id: C5b
    row: C5
    title: an agent filter for another tenant returns 0
    truth_sql: select 0
    compare: {values: [n]}
    slayer:
      query: {source_model: orders, filters: ["customers.region_id = 2"], measures: [{formula: "count(*)", name: n}]}
      options: {policy: north}

  - id: C5c
    row: C5
    title: from whitelisted regions, cross-model sums only see North
    truth_sql: |
      select r.name,
             (select sum(credit) from customers c where c.region_id = r.id and c.region_id = 1),
             (select sum(o.amount) from orders o join customers c on o.customer_id = c.id where c.region_id = r.id and c.region_id = 1)
      from regions r
    compare: {keys: [name], values: [total_credit, rev]}
    slayer:
      query: {source_model: regions, dimensions: [name],
              measures: [{formula: "sum(customers.credit)", name: total_credit}, {formula: "sum(customers.orders.amount)", name: rev}]}
      options: {policy: north}

  - id: C5d
    row: C5
    title: multi-stage query under the policy
    truth_sql: |
      select sum(amount), count(distinct customer_id) from orders o join customers c on o.customer_id = c.id where c.region_id = 1
    compare: {values: [t, n]}
    slayer:
      query:
        - {name: s1, source_model: orders, dimensions: [customer_id], measures: [{formula: "sum(amount)", name: rev}]}
        - {source_model: s1, measures: [{formula: "sum(rev)", name: t}, {formula: "count(*)", name: n}]}
      options: {policy: north}

  - id: C5e
    row: C5
    title: a table the policy does not cover (the orders_flat view) fails closed
    slayer:
      query: {source_model: orders_flat, measures: [{formula: "count(*)", name: n}]}
      options: {policy: north}
      expect: {error: ForcedFilterError}

  - id: C5f
    row: C5
    title: a query-backed model is scoped too
    truth_sql: select sum(amount) from orders o join customers c on o.customer_id = c.id where c.region_id = 1
    compare: {values: [v]}
    slayer:
      query: {source_model: monthly_rev, measures: [{formula: "sum(rev)", name: v}]}
      options: {policy: north}

  # ------------------------------------------------------------------ MetricFlow-specific probes
  - id: Q1-mf-metric-filter-region
    row: Q1
    title: a metric at region grain on region x city rows (nearest form, a metric filter) is refused
    metricflow:
      note: Metric() filters only take an entity of the queried metric's own model (customer, order)
      query:
        metrics: [revenue]
        group_by: [customer__region__name, customer__city]
        where: ['{{ Metric(''revenue'', group_by=[''customer__region'']) }} > 800']
      expect: {error: does not match any of the available group-by-items}

  - id: Q4-mf-offset-no-row
    row: Q4
    title: a year-ago offset metric over 2025-04..06 returns no rows (empty year-ago months drop out)
    truth_sql: select cast(null as date), cast(null as double) where false
    contrast_sql: |
      with m as (select date_trunc('month', order_date) as month, sum(amount) as rev from orders group by 1)
      select a.month, b.rev from m a left join m b on b.month = a.month - interval 12 month
      where a.month between date '2025-04-01' and date '2025-06-30'
    compare:
      keys: [metric_time__month]
      values: [revenue_prev_year]
    metricflow:
      model_declared: true
      query:
        metrics: [revenue_prev_year]
        group_by: [metric_time__month]
        start: '2025-04-01'
        end: '2025-06-30'

  - id: Q4-mf-change
    row: Q4
    title: month-over-month change via offset_window is calendar-aware, with extra NULL rows for months after data
    truth_sql: |
      with m as (select date_trunc('month', order_date) as month, sum(amount) as rev from orders group by 1),
           ms as (select month from m union select month + interval 1 month from m)
      select x.month, a.rev - b.rev from ms x left join m a on a.month = x.month
      left join m b on b.month = x.month - interval 1 month
    contrast_sql: |
      with m as (select date_trunc('month', order_date) as month, sum(amount) as rev from orders group by 1)
      select a.month, a.rev - b.rev from m a left join m b on b.month = a.month - interval 1 month
    compare:
      keys: [metric_time__month]
      values: [revenue_change]
    metricflow:
      model_declared: true
      query:
        metrics: [revenue_change]
        group_by: [metric_time__month]

  - id: Q4-mf-cum-day
    row: Q4
    title: an all-time cumulative metric by day, start/end do not clip the lookback
    truth_sql: |
      select d, (select sum(amount) from orders where order_date <= d)
      from generate_series(date '2024-12-30', date '2025-01-11', interval 1 day) t(d)
    compare:
      keys: [metric_time__day]
      values: [revenue_cum]
    metricflow:
      model_declared: true
      query:
        metrics: [revenue_cum]
        group_by: [metric_time__day]
        start: '2024-12-30'
        end: '2025-01-11'

  - id: Q4-mf-ytd-first
    row: Q4
    title: year-to-date at month grain (period_agg first) takes the first non-empty day, not the 1st
    note: YTD as of 2025-01-01 is empty; MetricFlow reports the 2025-01-10 value
    truth_sql: |
      select m, (select sum(amount) from orders where order_date >= date_trunc('year', m) and order_date <= m)
      from (values (date '2025-01-01'), (date '2025-02-01'), (date '2025-03-01')) t(m)
    compare:
      keys: [metric_time__month]
      values: [revenue_ytd]
    metricflow:
      model_declared: true
      query:
        metrics: [revenue_ytd]
        group_by: [metric_time__month]
        start: '2025-01-01'
        end: '2025-03-31'
      expect:
        known_bug: period_agg picks the first/last day that has a value, not the period's first/last day
        buggy_rows:
        - ['2025-01-01', 80]

  - id: Q5-mf-band-high
    row: Q5
    title: revenue of the 'high' band (customer total > 250) via a metric filter; one query per band
    truth_sql: |
      select sum(o.amount) from orders o
      join (select customer_id, sum(amount) ct from orders where customer_id is not null group by 1) c
        on o.customer_id = c.customer_id
      where c.ct > 250
    compare:
      values: [revenue]
    metricflow:
      query:
        metrics: [revenue]
