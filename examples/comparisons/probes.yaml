  # ------------------------------------------------------------------ Q19 one query, two APIs (Cube)
  - id: Q19-cube-rest
    row: Q19
    title: revenue by tier and status across two cubes, REST /load (customers root)
    truth_sql: |
      select c.tier, o.status, sum(o.amount) from customers c left join orders o on o.customer_id = c.id group by 1, 2
    compare: {keys: [tier, status], values: [revenue]}
    cube:
      planners: [tesseract]
      rest: {dimensions: [customers.tier, orders.status], measures: [orders.revenue]}
      keys: [customers.tier, orders.status]
      values: [orders.revenue]

  - id: Q19-cube-sql
    row: Q19
    title: the same query through the SQL API; the first cube in FROM is the root, on both planners
    truth_sql: |
      select c.tier, o.status, sum(o.amount) from customers c left join orders o on o.customer_id = c.id group by 1, 2
    compare: {keys: [tier, status], values: [revenue]}
    cube:
      sql: |
        select customers.tier as tier, orders.status as status, measure(orders.revenue) as revenue
        from customers cross join orders group by 1, 2


  - id: Q19-cube-rest-legacy
    row: Q19
    title: the legacy planner answers from the orders root (orphan order kept, Frank dropped)
    truth_sql: |
      select c.tier, o.status, sum(o.amount) from orders o left join customers c on o.customer_id = c.id group by 1, 2
    compare: {keys: [tier, status], values: [revenue]}
    cube:
