  # ------------------------------------------------------------------ Q7 deep composition
  - id: Q7a
    row: Q7
    title: cumsum(change(sum(amount))) (NULL changes skipped)
    truth_sql: |
      with m as (select date_trunc('month', order_date) as month, sum(amount) as rev from orders group by 1),
           c as (select a.month, a.rev - b.rev ch from m a left join m b on b.month = a.month - interval 1 month)
      select month, sum(ch) over (order by month) from c
    compare: {keys: [order_date], values: [v]}
    slayer:
      query: {source_model: orders, time_dimensions: [{dimension: order_date, granularity: month}],
              measures: [{formula: "cumsum(change(sum(amount)))", name: v}]}

  - id: Q7b
    row: Q7
    title: change(cumsum(sum(amount)))
    truth_sql: |
      with m as (select date_trunc('month', order_date) as month, sum(amount) as rev from orders group by 1),
           c as (select month, sum(rev) over (order by month) cs from m)
      select a.month, a.cs - b.cs from c a left join c b on b.month = a.month - interval 1 month
    compare: {keys: [order_date], values: [v]}
    slayer:
      query: {source_model: orders, time_dimensions: [{dimension: order_date, granularity: month}],
              measures: [{formula: "change(cumsum(sum(amount)))", name: v}]}

  - id: Q7c
    row: Q7
    title: a transform over order_date cells with no time dimension needs a time axis
    slayer:
      query: {source_model: orders_flat, dimensions: [region],
              measures: [{formula: "sum(cumsum(sum(amount, partition_by=[region, order_date])) - 1)", name: v}]}
      expect: {error: TimeAxisError}

  - id: Q7c2
    row: Q7
    title: same with a year time dimension (order_date = the year bucket)
    truth_sql: |
      select region, y, sum(cs - 1) from (
        select region, y, sum(s) over (partition by region order by y) cs from (
          select region, date_trunc('year', order_date) y, sum(amount) s from orders_flat group by 1, 2)) group by 1, 2
    compare: {keys: [region, order_date], values: [v]}
    slayer:
      query: {source_model: orders_flat, dimensions: [region], time_dimensions: [{dimension: order_date, granularity: year}],
              measures: [{formula: "sum(cumsum(sum(amount, partition_by=[region, order_date])) - 1)", name: v}]}
      expect: {warning: degenerate_reaggregation}

  - id: Q7d
    row: Q7
    title: time_shift of a mixed-grain ratio by region x month
    truth_sql: |
      with rm as (select region, date_trunc('month', order_date) as month, sum(amount) as rev from orders_flat group by 1, 2),
           m as (select date_trunc('month', order_date) as month, sum(amount) as rev from orders group by 1)
      select a.region, a.month, b.rev / mm.rev from rm a
      left join rm b on b.region is not distinct from a.region and b.month = a.month - interval 1 month
      left join m mm on mm.month = b.month
    compare: {keys: [region, order_date], values: [v]}
    slayer:
      query: {source_model: orders_flat, dimensions: [region], time_dimensions: [{dimension: order_date, granularity: month}],
              measures: [{formula: "time_shift(sum(amount) / sum(amount, partition_by=[order_date]), -1)", name: v}]}

  - id: Q7e
    row: Q7
    title: cumsum of a 90-day rolling sum
    truth_sql: |
      with w as (select m as month, (select sum(amount) from orders o
                   where o.order_date >= m + interval 1 month - interval 90 day and o.order_date < m + interval 1 month) w90
                 from (select distinct date_trunc('month', order_date) m from orders))
      select month, sum(w90) over (order by month) from w
    compare: {keys: [order_date], values: [v]}
    slayer:
      query: {source_model: orders, time_dimensions: [{dimension: order_date, granularity: month}],
              measures: [{formula: "cumsum(sum(amount, window='90d'))", name: v}]}

  - id: Q7f
    row: Q7
    title: a 90-day rolling sum in arithmetic (/ 2)
    truth_sql: |
      select m, (select sum(amount) from orders o
                 where o.order_date >= m + interval 1 month - interval 90 day and o.order_date < m + interval 1 month) / 2
      from (select distinct date_trunc('month', order_date) m from orders)
    compare: {keys: [order_date], values: [v]}
    slayer:
      query: {source_model: orders, time_dimensions: [{dimension: order_date, granularity: month}],
              measures: [{formula: "sum(amount, window='90d') / 2", name: v}]}

  - id: Q7g
    row: Q7
    title: rolling sum divided by the month's sum
    truth_sql: |
      select m, (select sum(amount) from orders o
                 where o.order_date >= m + interval 1 month - interval 90 day and o.order_date < m + interval 1 month)
               / (select sum(amount) from orders o where date_trunc('month', o.order_date) = m)
      from (select distinct date_trunc('month', order_date) m from orders)
    compare: {keys: [order_date], values: [v]}
    slayer:
      query: {source_model: orders, time_dimensions: [{dimension: order_date, granularity: month}],
              measures: [{formula: "sum(amount, window='90d') / sum(amount)", name: v}]}

  - id: Q7h
    row: Q7
    title: time_shift of a rolling sum
    truth_sql: |
      with w as (select m as month, (select sum(amount) from orders o
                   where o.order_date >= m + interval 1 month - interval 90 day and o.order_date < m + interval 1 month) w90
                 from (select distinct date_trunc('month', order_date) m from orders))
      select a.month, b.w90 from w a left join w b on b.month = a.month - interval 1 month
    compare: {keys: [order_date], values: [v]}
    slayer:
      query: {source_model: orders, time_dimensions: [{dimension: order_date, granularity: month}],
              measures: [{formula: "time_shift(sum(amount, window='90d'), -1)", name: v}]}

  - id: Q7i
    row: Q7
    title: last(change(sum(amount))) repeats the latest change
    truth_sql: |
      with m as (select date_trunc('month', order_date) as month, sum(amount) as rev from orders group by 1)
      select month, (select a.rev - b.rev from m a join m b on b.month = a.month - interval 1 month
                     where a.month = (select max(month) from m)) from m
    compare: {keys: [order_date], values: [v]}
    slayer:
      query: {source_model: orders, time_dimensions: [{dimension: order_date, granularity: month}],
              measures: [{formula: "last(change(sum(amount)))", name: v}]}

  - id: Q9c-1
    row: Q7
    title: sum(cumsum(sum(amount))) at month grain equals the running total
    truth_sql: |
