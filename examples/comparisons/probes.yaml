             timeDimensions: [{dimension: orders_ms.order_date, granularity: month, dateRange: ["2025-01-01", "2025-03-31"]}]}
      keys: [orders_ms.order_date.month]
      values: [orders_ms.customers_90d]

  - id: Q11-status
    row: Q11
    title: rolling sum with a date filter AND status='ok' (the date part does not clip, status does)
    truth_sql: |
      select m, (select sum(amount) from orders o where status = 'ok'
                 and o.order_date >= m + interval 1 month - interval 90 day and o.order_date < m + interval 1 month)
      from (select distinct date_trunc('month', order_date) m from orders where order_date >= '2025-01-01' and status = 'ok')
    compare: {keys: [order_date], values: [v]}
    slayer:
      query: {source_model: orders, time_dimensions: [{dimension: order_date, granularity: month}],
              filters: ["order_date >= '2025-01-01' and status = 'ok'"],
              measures: [{formula: "sum(amount, window='90d')", name: v}]}

  - id: W1
    row: Q11
    title: rolling sum and plain sum in one filter
    truth_sql: |
      with w as (select m, (select sum(amount) from orders o
                   where o.order_date >= m + interval 1 month - interval 90 day and o.order_date < m + interval 1 month) w90,
                 (select sum(amount) from orders o where date_trunc('month', o.order_date) = m) rev
                 from (select distinct date_trunc('month', order_date) m from orders))
      select m, rev from w where w90 > 400 and rev > 150
    compare: {keys: [order_date], values: [v]}
    slayer:
      query: {source_model: orders, time_dimensions: [{dimension: order_date, granularity: month}],
              filters: ["sum(amount, window='90d') > 400 and sum(amount) > 150"], measures: [{formula: "sum(amount)", name: v}]}

  - id: W3
    row: Q11
    title: change() of a rolling sum
    truth_sql: |
      with w as (select m, (select sum(amount) from orders o
                   where o.order_date >= m + interval 1 month - interval 90 day and o.order_date < m + interval 1 month) w90
                 from (select distinct date_trunc('month', order_date) m from orders))
      select a.m, a.w90 - b.w90 from w a left join w b on b.m = a.m - interval 1 month
    compare: {keys: [order_date], values: [v]}
    slayer:
      query: {source_model: orders, time_dimensions: [{dimension: order_date, granularity: month}],
              measures: [{formula: "change(sum(amount, window='90d'))", name: v}]}

  - id: Q11-moving
    row: Q11
    title: avg_moving / sum_moving use row frames (2024-12 averages over 2024-02..03)
    truth_sql: |
      with m as (select date_trunc('month', order_date) as month, sum(amount) as rev from orders group by 1)
      select month, avg(rev) over w, sum(rev) over w from m window w as (order by month rows between 2 preceding and current row)
    contrast_sql: |
      with m as (select date_trunc('month', order_date) as month, sum(amount) as rev from orders group by 1)
      select a.month, avg(b.rev), sum(b.rev) from m a join m b on b.month between a.month - interval 2 month and a.month group by 1
    compare: {keys: [m], values: [ma, sm]}
    malloy:
      query: |
        run: orders -> { group_by: m is order_date.month; aggregate: revenue; calculate: ma is avg_moving(revenue, 2), sm is sum_moving(revenue, 2); order_by: m }

  - id: Q11-distinct-sum
    row: Q11
    title: summing monthly distinct counts over a window is not a rolling distinct count
    truth_sql: |
      with m as (select date_trunc('month', order_date) as month, count(distinct customer_id) as nc from orders group by 1)
      select month, sum(nc) over (order by month rows between 2 preceding and current row) from m
    contrast_sql: |
      with mm as (select month, row_number() over (order by month) rn from (select distinct date_trunc('month', order_date) as month from orders)),
           om as (select date_trunc('month', order_date) as month, customer_id from orders)
      select a.month, count(distinct om.customer_id) from mm a join mm b on b.rn between a.rn - 2 and a.rn
      join om on om.month = b.month group by 1
    compare: {keys: [m], values: [roll]}
    malloy:
      query: |
        run: orders -> { group_by: m is order_date.month; aggregate: nc is count(customer_id); calculate: roll is sum_moving(nc, 2); order_by: m }

  - id: Q11-cube-rows-frame
    row: Q11
    title: SQL window frame ROWS 2 PRECEDING over a nested daily query (row-based)
    truth_sql: |
      with d as (select order_date, sum(amount) rev from orders group by 1)
      select order_date, sum(rev) over (order by order_date rows between 2 preceding and current row) from d
    contrast_sql: |
      with d as (select order_date, sum(amount) rev from orders group by 1)
      select order_date, sum(rev) over (order by order_date range between interval 30 day preceding and current row) from d
    compare: {keys: [order_date], values: [roll]}
    cube:
      sql: |
        select order_date, sum(rev) over (order by order_date rows between 2 preceding and current row) as roll
        from (select date_trunc('day', order_date) as order_date, measure(revenue) as rev from orders group by 1) t

  - id: Q11-cube-range-frame
    row: Q11
    title: a RANGE INTERVAL frame over the same nested query is not supported
    cube:
      sql: |
        select order_date, sum(rev) over (order by order_date range between interval '30 days' preceding and current row) as roll
        from (select date_trunc('day', order_date) as order_date, measure(revenue) as rev from orders group by 1) t
      expect: {error: "Window frame bound must be a non-negative integer literal"}

  - id: Q11-cube-rolling-no-range
    row: Q11
    title: a rolling_window measure with a granularity but no dateRange
    cube:
      model_declared: true
      schema: [model_declared/multi_stage.yml]
      rest: {measures: [orders_ms.revenue_90d], timeDimensions: [{dimension: orders_ms.order_date, granularity: month}]}
      expect: {error: "Date range is required for time series"}
      planner_expect:
        legacy: {error: "Time series queries without dateRange aren't supported"}

  # ------------------------------------------------------------------ Q12 aggregates as arguments
  - id: Q12a
    row: Q12
    title: sum(amount - customers.discount) by region
    truth_sql: select region, sum(amount - discount) from orders_flat group by 1
    compare: {keys: [region], values: [net]}
    slayer:
      query: {source_model: orders, dimensions: [customers.regions.name],
              measures: [{formula: "sum(amount - customers.discount)", name: net}]}
      keys: [customers.regions.name]
    malloy:
      query: |
        run: orders -> { group_by: region; aggregate: net is source.sum(amount - customers.discount) }
    cube:
      note: SQL API pushdown, an expression inside SUM()
      sql: select region, sum(amount - discount) as net from orders_flat group by 1

  - id: Q12-agg-in-agg
    row: Q12
    title: an aggregate inside an aggregate, sum(amount * all(count()))
    malloy:
      query: |
        run: orders -> { group_by: status; aggregate: x is sum(amount * all(count())) }
      expect: {compile_error: aggregate-of-aggregate}

  - id: Q12b
    row: Q12
    title: weighted_avg(amount, weight=customers.credit) by status
    truth_sql: select status, sum(amount * credit) / sum(credit) from orders_flat where credit is not null group by 1
    compare: {keys: [status], values: [v]}
    slayer:
      query: {source_model: orders, dimensions: [status],
              measures: [{formula: "weighted_avg(amount, weight=customers.credit)", name: v}]}

  - id: Q12c
    row: Q12
    title: weighted_avg with a region-total weight by status
    truth_sql: |
      select status, sum(amount * w) / sum(w) from (
        select status, amount, sum(amount) over (partition by region) w from orders_flat) group by 1
    compare: {keys: [status], values: [v]}
    slayer:
      query: {source_model: orders, dimensions: [status],
              measures: [{formula: "weighted_avg(amount, weight=sum(amount, partition_by=customers.regions.name))", name: v}]}

  - id: Q12d
    row: Q12
    title: weighted_avg(customers.credit, weight=region total) by region
    truth_sql: select r.name, avg(c.credit) from customers c left join regions r on c.region_id = r.id group by 1
    compare: {keys: [customers.regions.name], values: [v]}
    slayer:
      query: {source_model: orders, dimensions: [customers.regions.name],
              measures: [{formula: "weighted_avg(customers.credit, weight=sum(amount, partition_by=customers.regions.name))", name: v}]}

  # ------------------------------------------------------------------ Q13 order by what you don't show
  - id: Q13a
    row: Q13
    title: order by an undeclared sum(amount)/count(*), limit 3 (values)
    truth_sql: |
      select c.name, count(*) from orders o left join customers c on o.customer_id = c.id
      group by 1 order by sum(o.amount) / count(*) desc limit 3
    compare: {keys: [customers.name], values: [order_count]}
    slayer:
      query: {source_model: orders, dimensions: [customers.name], limit: 3,
              order: [{column: "sum(amount) / count(*)", direction: desc}], measures: [{formula: "count(*)", name: order_count}]}
    metricflow:
      query:
        metrics: [order_count]
        group_by: [customer__name]
        order: [-revenue]
        limit: 3
      expect: {error: does not match exactly one of the query items}

  - id: Q13a-order
    row: Q13
    title: same, row order kept and the sort column dropped from the output
    truth_sql: |
      select c.name, count(*) from orders o left join customers c on o.customer_id = c.id
      group by 1 order by sum(o.amount) / count(*) desc limit 3
    compare: {keys: [name], values: [order_count], ordered: true, columns_exact: true}
    slayer:
      query: {source_model: orders, dimensions: [customers.name], limit: 3,
              order: [{column: "sum(amount) / count(*)", direction: desc}], measures: [{formula: "count(*)", name: order_count}]}
      keys: [customers.name]
    malloy:
      note: two-stage workaround, sort in stage 1 then select
      query: |
        run: orders -> { group_by: name is customers.name; aggregate: order_count, aov; order_by: aov desc; limit: 3 } -> { select: name, order_count }

  - id: Q13-not-in-output
    row: Q13
    title: order_by an aggregate that is not in the output
    malloy:
      query: |
        run: orders -> { group_by: customers.name; aggregate: order_count; order_by: revenue desc; limit: 3 }
      expect: {compile_error: order-by-not-found-in-output}

  - id: Q13-dotted
    row: Q13
    title: order_by a dotted path
    malloy:
      query: |
        run: orders -> { group_by: status; aggregate: order_count; order_by: customers.name }
      expect: {compile_error: order-by-bad-reference}

  - id: Q13-calc
    row: Q13
    title: order_by a calculation
    malloy:
      query: |
        run: orders -> { group_by: m is order_date.month; aggregate: revenue; calculate: prev is lag(revenue); order_by: prev desc }
      expect: {compile_error: order-by-analytic}

  - id: Q13b
    row: Q13
    title: order by an undeclared transform rank(sum(amount)) asc
    truth_sql: |
      select c.name, count(*) from orders o left join customers c on o.customer_id = c.id
      group by 1 order by sum(o.amount) desc limit 3
    compare: {keys: [customers.name], values: [order_count]}
    slayer:
      query: {source_model: orders, dimensions: [customers.name], limit: 3,
              order: [{column: "rank(sum(amount))", direction: asc}], measures: [{formula: "count(*)", name: order_count}]}

  - id: Q13c
    row: Q13
    title: order by an undeclared cross-model sum(customers.credit)
    truth_sql: select status, count(*) from orders group by 1
    compare: {keys: [status], values: [order_count], columns_exact: true}
    slayer:
      query: {source_model: orders, dimensions: [status],
              order: [{column: "sum(customers.credit)", direction: desc}], measures: [{formula: "count(*)", name: order_count}]}

  - id: Q13-cube-order-measure
    row: Q13
    title: order by an unselected measure (revenue desc), limit 3
    truth_sql: |
      select c.name, count(o.id) from customers c left join orders o on o.customer_id = c.id
      group by 1 order by sum(o.amount) desc nulls last limit 3
    compare: {keys: [customers.name], values: [orders.count], ordered: true}
    cube:
      rest: {dimensions: [customers.name], measures: [orders.count], order: [[orders.revenue, desc]], limit: 3}
      planner_expect:
        legacy: {known_bug: "by design per https://github.com/cube-js/cube/issues/282", sql_lacks: ORDER BY}

  - id: Q13-cube-order-dimension
    row: Q13
    title: order by an unselected dimension (customers.credit) is dropped without an error
    truth_sql: |
      select c.name, count(o.id) from customers c left join orders o on o.customer_id = c.id group by 1, c.credit order by c.credit desc
    compare: {keys: [customers.name], values: [orders.count], ordered: true}
    cube:
      rest: {dimensions: [customers.name], measures: [orders.count], order: [[customers.credit, desc]]}
      expect: {known_bug: "by design per https://github.com/cube-js/cube/issues/282", sql_lacks: ORDER BY}

  # ------------------------------------------------------------------ Q14 ranking and streaks
  - id: Q14a
    row: Q14
    title: top customer per region
    truth_sql: |
      select region, name, s from (
        select f.region, c.name, sum(f.amount) s, rank() over (partition by f.region order by sum(f.amount) desc) rk
        from orders_flat f left join customers c on f.customer_id = c.id group by 1, 2) where rk <= 1
    compare: {keys: [region, name], values: [revenue]}
    slayer:
      query: {source_model: orders, dimensions: [customers.regions.name, customers.name],
              filters: ["rank(sum(amount), partition_by=customers.regions.name) <= 1"],
              measures: [{formula: "sum(amount)", name: revenue}]}
      keys: [customers.regions.name, customers.name]
    malloy:
      note: rank() in one stage, filter in the next
      query: |
        run: orders -> { group_by: region, name is customers.name; aggregate: revenue; calculate: rk is rank() { partition_by: region; order_by: revenue desc } }
          -> { where: rk = 1; select: region, name, revenue }

  - id: Q14a-nest
    row: Q14
    title: top customer per region via nest with limit 1
    truth_sql: |
      select region, name, s from (
        select f.region, c.name, sum(f.amount) s, rank() over (partition by f.region order by sum(f.amount) desc) rk
        from orders_flat f left join customers c on f.customer_id = c.id group by 1, 2) where rk <= 1
    compare: {keys: [region, top.name], values: [top.revenue]}
    malloy:
      query: |
        run: orders -> { group_by: region; nest: top is { group_by: name is customers.name; aggregate: revenue; limit: 1 } }
      flatten: top

  - id: Q14b
    row: Q14
    title: dense_rank per region <= 1 on the flat view
    truth_sql: |
      select region, city, s from (
        select region, city, sum(amount) s, dense_rank() over (partition by region order by sum(amount) desc) rk
        from orders_flat group by 1, 2) where rk <= 1
    compare: {keys: [region, city], values: [v]}
    slayer:
      query: {source_model: orders_flat, dimensions: [region, city],
              filters: ["dense_rank(sum(amount), partition_by=region) <= 1"], measures: [{formula: "sum(amount)", name: v}]}

  - id: W2
    row: Q14
    title: rank of a rolling sum
    truth_sql: |
      with w as (select m, (select sum(amount) from orders o
                   where o.order_date >= m + interval 1 month - interval 90 day and o.order_date < m + interval 1 month) w90
                 from (select distinct date_trunc('month', order_date) m from orders))
      select m, rank() over (order by w90 desc) from w
    compare: {keys: [order_date], values: [v]}
    slayer:
      query: {source_model: orders, time_dimensions: [{dimension: order_date, granularity: month}],
              measures: [{formula: "rank(sum(amount, window='90d'))", name: v}]}

  - id: Q14c
    row: Q14
    title: streak of months with revenue > 100, broken by empty months
    truth_sql: |
      with m as (select date_trunc('month', order_date) as month, sum(amount) as rev from orders group by 1),
           f as (select month, rev > 100 as up, lag(rev > 100) over (order by month) as prev_up,
                        lag(month) over (order by month) as pm from m),
           g as (select *, sum(case when up and prev_up and pm = month - interval 1 month then 0 else 1 end)
                             over (order by month) as grp from f)
      select month, case when up then row_number() over (partition by grp order by month) else 0 end from g
    compare: {keys: [order_date], values: [streak]}
    slayer:
      query: {source_model: orders, time_dimensions: [{dimension: order_date, granularity: month}],
              measures: [{formula: "consecutive_periods(sum(amount) > 100)", name: streak}]}
    malloy:
      note: four stages (lag the month, flag run starts, number the runs, cumulate within a run)
      query: |
        run: orders -> { group_by: m is order_date.month; aggregate: revenue }
          -> { group_by: m, up is pick 1 when revenue > 100 else 0; calculate: prev_m is lag(m); order_by: m }
          -> { group_by: m, up, new_run is pick 1 when up = 1 and (prev_m is null or prev_m != m - 1 month) else 0; calculate: grp is sum_cumulative(new_run); order_by: m }
          -> { group_by: m, grp; aggregate: up is up.max(); calculate: streak is sum_cumulative(up) { partition_by: grp }; order_by: m }
      keys: [m]

  - id: Q14d
    row: Q14
    title: filter consecutive_periods(sum(amount) > 100) >= 2
    truth_sql: |
      with m as (select date_trunc('month', order_date) as month, sum(amount) as rev from orders group by 1),
           f as (select month, rev, rev > 100 as up, lag(rev > 100) over (order by month) as prev_up,
                        lag(month) over (order by month) as pm from m),
           g as (select *, sum(case when up and prev_up and pm = month - interval 1 month then 0 else 1 end)
                             over (order by month) as grp from f),
           s as (select month, rev, case when up then row_number() over (partition by grp order by month) else 0 end streak from g)
      select month, rev from s where streak >= 2
    compare: {keys: [order_date], values: [v]}
    slayer:
      query: {source_model: orders, time_dimensions: [{dimension: order_date, granularity: month}],
              filters: ["consecutive_periods(sum(amount) > 100) >= 2"], measures: [{formula: "sum(amount)", name: v}]}

  - id: Q14-cube-rank
    row: Q14
    title: RANK() per region in an outer query over a nested region x city query
    truth_sql: |
      select region, city, rank() over (partition by region order by sum(amount) desc) from orders_flat group by 1, 2
    compare: {keys: [region, city], values: [rk]}
    cube:
      sql: |
        select region, city, cast(rank() over (partition by region order by rev desc) as int) as rk from (select region, city, measure(revenue) as rev from orders_flat group by 1, 2) t

  - id: Q14-cube-rank-uncast
    row: Q14
    title: the same RANK() without a CAST fails on its UInt64 result type
    cube:
      sql: select region, city, rank() over (partition by region order by rev desc) as rk from (select region, city, measure(revenue) as rev from orders_flat group by 1, 2) t
      expect: {error: "Type UInt64 is not supported"}

  - id: Q14-cube-rank-measure
    row: Q14
    title: "multi-stage rank measure, reduce_by [city] (rank within region)"
    truth_sql: |
      select region, city, rank() over (partition by region order by sum(amount) desc) from orders_flat group by 1, 2
    compare: {keys: [orders_ms.region, orders_ms.city], values: [orders_ms.revenue_rank]}
    cube:
      model_declared: true
      schema: [model_declared/multi_stage.yml]
      rest: {dimensions: [orders_ms.region, orders_ms.city], measures: [orders_ms.revenue, orders_ms.revenue_rank]}

  - id: Q14-cube-rank-measure-filtered
    row: Q14
    title: the rank measure under a status = 'ok' filter ranks the filtered revenue
    truth_sql: |
      select region, city, rank() over (partition by region order by sum(amount) desc) from orders_flat
      where status = 'ok' group by 1, 2
    compare: {keys: [orders_ms.region, orders_ms.city], values: [orders_ms.revenue_rank]}
    cube:
      model_declared: true
      schema: [model_declared/multi_stage.yml]
      rest: {dimensions: [orders_ms.region, orders_ms.city], measures: [orders_ms.revenue, orders_ms.revenue_rank],
             filters: [{member: orders_ms.status, operator: equals, values: [ok]}]}

  # ------------------------------------------------------------------ Q15 multi-stage queries
  - id: Q15a
    row: Q15
    title: two stages, average of per-customer revenue
    truth_sql: select avg(s) from (select customer_id, sum(amount) s from orders group by 1)
    compare: {values: [avg_rev]}
    slayer:
      query:
        - {name: by_cust, source_model: orders, dimensions: [customer_id], measures: [{formula: "sum(amount)", name: rev}]}
        - {source_model: by_cust, measures: [{formula: "avg(rev)", name: avg_rev}]}
    malloy:
      query: |
        run: orders -> { group_by: customer_id; aggregate: rev is revenue } -> { aggregate: avg_rev is rev.avg() }
    cube:
      sql: select avg(rev) as avg_rev from (select customer_id, measure(revenue) as rev from orders group by 1) t

  - id: Q15b
    row: Q15
    title: out-of-order stage list (a stage joins a later-listed stage)
    truth_sql: |
      select max(s) from (select c.tier, sum(o.amount) s from customers c join orders o on o.customer_id = c.id group by 1)
    compare: {values: [best]}
    slayer:
      query:
        - {name: joined, source_model: {source_name: customers, joins: [{target_model: by_cust, join_pairs: [[id, customer_id]]}]},
           dimensions: [tier], measures: [{formula: "sum(by_cust.rev)", name: tier_rev}]}
        - {name: by_cust, source_model: orders, dimensions: [customer_id], measures: [{formula: "sum(amount)", name: rev}]}
        - {source_model: joined, measures: [{formula: "max(tier_rev)", name: best}]}

  - id: Q15c
    row: Q15
    title: re-bucket month to year downstream
    truth_sql: select date_trunc('year', order_date), sum(amount) from orders group by 1
    compare: {keys: [order_date], values: [yr]}
    slayer:
      query:
        - {name: monthly, source_model: orders, time_dimensions: [{dimension: order_date, granularity: month}],
           measures: [{formula: "sum(amount)", name: rev}]}
        - {source_model: monthly, time_dimensions: [{dimension: order_date, granularity: year}], measures: [{formula: "sum(rev)", name: yr}]}

  - id: Q15d
    row: Q15
    title: change() in a downstream stage is calendar-aware
    truth_sql: |
      with m as (select date_trunc('month', order_date) as month, sum(amount) as rev from orders group by 1)
      select a.month, a.rev - b.rev from m a left join m b on b.month = a.month - interval 1 month
    compare: {keys: [order_date], values: [ch]}
    slayer:
      query:
        - {name: monthly, source_model: orders, time_dimensions: [{dimension: order_date, granularity: month}],
           measures: [{formula: "sum(amount)", name: rev}]}
        - {source_model: monthly, time_dimensions: [{dimension: order_date, granularity: month}],
           measures: [{formula: "change(sum(rev))", name: ch}, {formula: "time_shift(sum(rev), -1, 'year')", name: yoy}]}

  - id: Q15e
    row: Q15
    title: time_shift by a year in a downstream stage
    truth_sql: |
      with m as (select date_trunc('month', order_date) as month, sum(amount) as rev from orders group by 1)
      select a.month, b.rev from m a left join m b on b.month = a.month - interval 12 month
    compare: {keys: [order_date], values: [yoy]}
    slayer:
      query:
        - {name: monthly, source_model: orders, time_dimensions: [{dimension: order_date, granularity: month}],
           measures: [{formula: "sum(amount)", name: rev}]}
        - {source_model: monthly, time_dimensions: [{dimension: order_date, granularity: month}],
           measures: [{formula: "change(sum(rev))", name: ch}, {formula: "time_shift(sum(rev), -1, 'year')", name: yoy}]}

  - id: Q15f
    row: Q15
    title: a day time dimension over a month-bucketed stage column is rejected
    slayer:
      query:
        - {name: monthly, source_model: orders, time_dimensions: [{dimension: order_date, granularity: month}],
           measures: [{formula: "sum(amount)", name: rev}]}
        - {source_model: monthly, time_dimensions: [{dimension: order_date, granularity: day}], measures: [{formula: "sum(rev)", name: x}]}
      expect: {error: TimeDimensionColumnError}

  - id: Q15g
    row: Q15
    title: week over a month-bucketed stage column (non-nesting) is rejected
    slayer:
      query:
        - {name: monthly, source_model: orders, time_dimensions: [{dimension: order_date, granularity: month}],
           measures: [{formula: "sum(amount)", name: rev}]}
        - {source_model: monthly, time_dimensions: [{dimension: order_date, granularity: week}], measures: [{formula: "sum(rev)", name: x}]}
      expect: {error: TimeDimensionColumnError}

  - id: Q15h
    row: Q15
    title: quarter over a month-bucketed stage (a query as a source, re-bucketed)
    truth_sql: select date_trunc('quarter', order_date), sum(amount) from orders group by 1
    compare: {keys: [order_date], values: [rev_q]}
    slayer:
      query:
        - {name: monthly, source_model: orders, time_dimensions: [{dimension: order_date, granularity: month}],
           measures: [{formula: "sum(amount)", name: rev}]}
        - {source_model: monthly, time_dimensions: [{dimension: order_date, granularity: quarter}], measures: [{formula: "sum(rev)", name: rev_q}]}
    malloy:
      query: |
        query: monthly is orders -> { group_by: d is order_date.month; aggregate: revenue }
        run: monthly -> { group_by: q is d.quarter; aggregate: rev_q is revenue.sum() }
      keys: [q]

  # ------------------------------------------------------------------ Q16 inline model extension
  - id: Q16a
    row: Q16
    title: an inline column for one query
    truth_sql: select case when amount > 100 then 'big' else 'small' end, count(*) from orders group by 1
    compare: {keys: [size], values: [order_count]}
    slayer:
      query: {source_model: {source_name: orders,
                             columns: [{name: size, sql: "CASE WHEN amount > 100 THEN 'big' ELSE 'small' END", type: string}]},
              dimensions: [size], measures: [{formula: "count(*)", name: order_count}]}
    malloy:
      query: |
        run: orders -> { extend: { dimension: size is pick 'big' when amount > 100 else 'small' } group_by: size; aggregate: order_count }
    cube:
      note: SQL API pushdown, a CASE dimension for one query
      sql: select case when amount > 100 then 'big' else 'small' end as size, count(*) as order_count from orders group by 1

  - id: Q16b
    row: Q16
    title: an inline join for one query
    truth_sql: select c.tier, sum(o.amount) from customers c left join orders o on o.customer_id = c.id group by 1
    compare: {keys: [tier], values: [v]}
    slayer:
      query: {source_model: {source_name: customers, joins: [{target_model: orders_flat, join_pairs: [[id, customer_id]]}]},
              dimensions: [tier], measures: [{formula: "sum(orders_flat.amount)", name: v}]}

  - id: Q16c
    row: Q16
    title: an inline measure used by name
    truth_sql: select status, sum(amount) / (select sum(amount) from orders) from orders group by 1
    compare: {keys: [status], values: [v]}
    slayer:
      query: {source_model: {source_name: orders, measures: [{name: big_share, formula: "sum(amount) / sum(amount, partition_by=[])"}]},
              dimensions: [status], measures: [{formula: "big_share", name: v}]}

  - id: Q16-cube-dow
    row: Q16
    title: SQL API pushdown, EXTRACT(DOW) with SUM(amount) via a nested ungrouped query
    truth_sql: select extract(dow from order_date), sum(amount) from orders group by 1
    compare: {keys: [dow], values: [rev]}
    cube:
      sql: select dow, sum(amount) as rev from (select extract(dow from order_date) as dow, amount from orders) t group by 1

  - id: Q16-cube-dow-direct
    row: Q16
    title: the same EXTRACT(DOW) with SUM(amount) in one SELECT is not detected as a Cube query
    cube:
