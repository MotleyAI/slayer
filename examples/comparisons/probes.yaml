      left join regions r on c.region_id = r.id left join orders o on o.customer_id = c.id group by 1
    compare: {keys: [regions.name], values: [rev, n_orders, n_customers]}
    slayer:
      query: {source_model: customers, dimensions: [regions.name],
              measures: [{formula: "sum(orders.amount)", name: rev}, {formula: "count(orders.id)", name: n_orders},
                         {formula: "count(*)", name: n_customers}]}

  - id: B1-assoc
    row: Q9
    title: same with to_many_handling=associate
    truth_sql: |
      with k as (select distinct r.name from customers c left join regions r on c.region_id = r.id),
           v as (select r.name, sum(o.amount) rev from orders o left join customers c on o.customer_id = c.id
                 left join regions r on c.region_id = r.id group by 1)
      select k.name, v.rev from k left join v on k.name is not distinct from v.name
    contrast_sql: |
      select r.name, sum(o.amount) from customers c left join regions r on c.region_id = r.id
      left join orders o on o.customer_id = c.id group by 1
    compare: {keys: [regions.name], values: [rev]}
    slayer:
      query: {source_model: customers, dimensions: [regions.name], measures: [{formula: "sum(orders.amount)", name: rev}]}
      options: {to_many_handling: associate}

  - id: B1-tier
    row: Q9
    title: by tier (no NULL group), the orphan order does not leak
    truth_sql: select c.tier, sum(o.amount) from customers c left join orders o on o.customer_id = c.id group by 1
    compare: {keys: [tier], values: [rev]}
    slayer:
      query: {source_model: customers, dimensions: [tier], measures: [{formula: "sum(orders.amount)", name: rev}]}
    cube:
      planners: [tesseract]
      rest: {dimensions: [customers.tier], measures: [orders.revenue]}
      keys: [customers.tier]
      values: [orders.revenue]


  - id: B1-cube-tier-legacy
    row: Q9
    title: "legacy: revenue by customers.tier roots at orders, so the orphan order forms a NULL tier"
    truth_sql: select c.tier, sum(o.amount) from orders o left join customers c on o.customer_id = c.id group by 1
    contrast_sql: select c.tier, sum(o.amount) from customers c left join orders o on o.customer_id = c.id group by 1
    compare: {keys: [customers.tier], values: [orders.revenue]}
    cube:
      planners: [legacy]
      rest: {dimensions: [customers.tier], measures: [orders.revenue]}
  - id: B2
    row: Q9
    title: count(orders.*) and count_distinct(orders.id) per customer, Frank must be 0
    truth_sql: |
      select c.name, count(o.id), count(distinct o.id) from customers c left join orders o on o.customer_id = c.id group by 1
    compare: {keys: [name], values: [n, nd]}
    slayer:
      query: {source_model: customers, dimensions: [name],
              measures: [{formula: "count(orders.*)", name: n}, {formula: "count_distinct(orders.id)", name: nd}]}

  - id: B2-coalesce
    row: Q9
    title: "workaround: coalesce(count(orders.id), 0)"
    truth_sql: select c.name, count(o.id) from customers c left join orders o on o.customer_id = c.id where c.name = 'Frank' group by 1
    compare: {keys: [name], values: [n]}
    slayer:
      query: {source_model: customers, dimensions: [name], filters: ["name = 'Frank'"],
              measures: [{formula: "coalesce(count(orders.id), 0)", name: n}]}

  - id: Q9-cube-no-pk
    row: Q9
    title: a join between cubes without primary keys fails to compile
    cube:
      schema: [model_variants/no_pk.yml]
      rest: {dimensions: [orders_nopk.status], measures: [customers_nopk.credit_sum]}
      expect: {error: "primary key for 'customers_nopk' is required when join is defined"}

  # ------------------------------------------------------------------ Q10 filters across one-to-many joins
  - id: Q10a
    row: Q10
    title: customers with an ok order, counted once
    truth_sql: select count(*), sum(credit) from customers where id in (select customer_id from orders where status = 'ok')
    compare: {values: [n, total_credit]}
    slayer:
      query: {source_model: customers, filters: ["orders.status = 'ok'"],
              measures: [{formula: "count(*)", name: n}, {formula: "sum(credit)", name: total_credit}]}
    malloy:
      query: |
        run: customers -> { where: orders.status = 'ok'; aggregate: n is customer_count, total_credit is credit.sum() }
    cube:
      rest: {measures: [customers.count, customers.credit_sum],
             filters: [{member: orders.status, operator: equals, values: [ok]}]}
      values: [customers.count, customers.credit_sum]
    metricflow:
      model_declared: true
      note: needs ok_order_count, a simple metric with a status filter, declared in the model
      query:
        metrics: [customer_count, credit_total]
        where: ['{{ Metric(''ok_order_count'', group_by=[''customer'']) }} > 0']
      values: [customer_count, credit_total]

  - id: Q10a-restricts-orders
    row: Q10
    title: the same where also restricts the orders aggregates
    truth_sql: |
      select count(distinct c.id), count(o.id), sum(o.amount) from customers c join orders o on o.customer_id = c.id
      where o.status = 'ok'
    contrast_sql: |
      select (select count(*) from customers where id in (select customer_id from orders where status = 'ok')),
             (select count(*) from orders where customer_id is not null), (select sum(amount) from orders where customer_id is not null)
    compare: {values: [n, n_orders, rev]}
    malloy:
      query: |
        run: customers -> { where: orders.status = 'ok'; aggregate: n is customer_count, n_orders is count(orders.id), rev is orders.revenue }

  - id: Q10b
    row: Q10
    title: tier='gold' or orders.status='ok' keeps no-order gold Frank
    truth_sql: |
      select count(*), sum(credit) from customers
      where tier = 'gold' or id in (select customer_id from orders where status = 'ok')
    compare: {values: [n, total_credit]}
    slayer:
      query: {source_model: customers, filters: ["tier = 'gold' or orders.status = 'ok'"],
              measures: [{formula: "count(*)", name: n}, {formula: "sum(credit)", name: total_credit}]}
    malloy:
      note: or is evaluated per joined row
      query: |
        run: customers -> { where: tier = 'gold' or orders.status = 'ok'; aggregate: n is customer_count, total_credit is credit.sum() }
    cube:
      note: an or across cubes
      rest: {measures: [customers.count, customers.credit_sum],
             filters: [{or: [{member: customers.tier, operator: equals, values: [gold]},
                             {member: orders.status, operator: equals, values: [ok]}]}]}
      values: [customers.count, customers.credit_sum]
    metricflow:
      model_declared: true
      query:
        metrics: [customer_count, credit_total]
        where: ['{{ Dimension(''customer__tier'') }} = ''gold'' OR {{ Metric(''ok_order_count'', group_by=[''customer'']) }} >
            0']
      values: [customer_count, credit_total]

  - id: Q10c
    row: Q10
    title: tier='bronze' or orders.status='bad'
    truth_sql: |
      select count(*), sum(credit) from customers
      where tier = 'bronze' or id in (select customer_id from orders where status = 'bad')
    compare: {values: [n, total_credit]}
    slayer:
      query: {source_model: customers, filters: ["tier = 'bronze' or orders.status = 'bad'"],
              measures: [{formula: "count(*)", name: n}, {formula: "sum(credit)", name: total_credit}]}
    malloy:
      query: |
        run: customers -> { where: tier = 'bronze' or orders.status = 'bad'; aggregate: n is customer_count, total_credit is credit.sum() }
    cube:
      rest: {measures: [customers.count, customers.credit_sum],
             filters: [{or: [{member: customers.tier, operator: equals, values: [bronze]},
                             {member: orders.status, operator: equals, values: [bad]}]}]}
      values: [customers.count, customers.credit_sum]

  - id: Q10d
    row: Q10
    title: not (orders.status = 'bad') is existential (some joined row where NOT holds)
    truth_sql: |
      select count(*), sum(credit) from customers c where exists (
        select 1 from customers c2 left join orders o on o.customer_id = c2.id where c2.id = c.id and not (o.status = 'bad'))
    contrast_sql: select count(*), sum(credit) from customers where id not in (select customer_id from orders where status = 'bad')
    compare: {values: [n, total_credit]}
    slayer:
      query: {source_model: customers, filters: ["not (orders.status = 'bad')"],
              measures: [{formula: "count(*)", name: n}, {formula: "sum(credit)", name: total_credit}]}

  - id: Q10d-malloy
    row: Q10
    title: not (orders.status = 'bad') is existential, NULL-safe (Frank's null-extended row qualifies)
    truth_sql: |
      select count(distinct c.id), sum(distinct c.credit) from customers c left join orders o on o.customer_id = c.id
      where o.status is distinct from 'bad'
    contrast_sql: select count(*), sum(credit) from customers where id not in (select customer_id from orders where status = 'bad')
    compare: {values: [n, total_credit]}
    malloy:
      query: |
        run: customers -> { where: not (orders.status = 'bad'); aggregate: n is customer_count, total_credit is credit.sum() }

  - id: Q10e
    row: Q10
    title: orders.id is null (customers with no orders)
    truth_sql: |
      select count(*), sum(credit) from customers
      where id not in (select customer_id from orders where customer_id is not null)
    compare: {values: [n, total_credit]}
    slayer:
      query: {source_model: customers, filters: ["orders.id is null"],
              measures: [{formula: "count(*)", name: n}, {formula: "sum(credit)", name: total_credit}]}
    malloy:
      query: |
        run: customers -> { where: orders.id is null; aggregate: n is customer_count, total_credit is credit.sum() }
    metricflow:
      query:
        metrics: [customer_count, credit_total]
        where: ['{{ Metric(''order_count'', group_by=[''customer'']) }} IS NULL']
      values: [customer_count, credit_total]

  - id: Q10f
    row: Q10
    title: two to-many conditions in one filter bind to the same order row
    truth_sql: |
      select count(*), sum(credit) from customers where id in (select customer_id from orders where amount > 250 and status = 'bad')
    compare: {values: [n, total_credit]}
    slayer:
      query: {source_model: customers, filters: ["orders.amount > 250 and orders.status = 'bad'"],
              measures: [{formula: "count(*)", name: n}, {formula: "sum(credit)", name: total_credit}]}

  - id: Q10g
    row: Q10
    title: two separate filter entries amount>250 / status='bad'
    truth_sql: |
      select count(*), sum(credit) from customers where id in (select customer_id from orders where amount > 250 and status = 'bad')
    compare: {values: [n, total_credit]}
    slayer:
      query: {source_model: customers, filters: ["orders.amount > 250", "orders.status = 'bad'"],
              measures: [{formula: "count(*)", name: n}, {formula: "sum(credit)", name: total_credit}]}

  - id: Q10h
    row: Q10
    title: orders.status <> 'bad' (existential)
    truth_sql: |
      select count(*), sum(credit) from customers where id in (select customer_id from orders where status <> 'bad')
    compare: {values: [n, total_credit]}
    slayer:
      query: {source_model: customers, filters: ["orders.status <> 'bad'"],
              measures: [{formula: "count(*)", name: n}, {formula: "sum(credit)", name: total_credit}]}
    cube:
      planners: [tesseract]
      note: measure-only, so the query roots at orders; Frank (no orders) cannot appear
      rest: {measures: [customers.count, customers.credit_sum],
             filters: [{member: orders.status, operator: notEquals, values: [bad]}]}
      values: [customers.count, customers.credit_sum]

  - id: Q10-exists-having
    row: Q10
    title: having orders.count() { where } > 0 as an exists filter
    truth_sql: |
      select c.name, count(o.id) from customers c join orders o on o.customer_id = c.id where o.status = 'ok' group by 1
    compare: {keys: [name], values: [n_ok]}
    malloy:
      query: |
        run: customers -> { group_by: name; aggregate: n_ok is orders.count() { where: orders.status = 'ok' }; having: orders.count() { where: orders.status = 'ok' } > 0 }

  - id: Q10-antijoin-count
    row: Q10
    title: anti-join having orders.count() = 0 returns nothing
    truth_sql: select name, 0 from customers where id not in (select customer_id from orders where customer_id is not null)
    compare: {keys: [name], values: [n]}
    malloy:
      query: |
        run: customers -> { group_by: name; aggregate: n is orders.count(); having: orders.count() = 0 }
      expect: {known_bug: "https://github.com/malloydata/malloy/issues/1762", buggy_row_count: 0}

  - id: X2
    row: Q10
    title: regions filtered by a two-hop to-many condition
    truth_sql: |
      select r.name, count(*) from regions r where exists (
        select 1 from customers c join orders o on o.customer_id = c.id where c.region_id = r.id and o.status = 'bad') group by 1
    compare: {keys: [name], values: [v]}
    slayer:
      query: {source_model: regions, dimensions: [name], filters: ["customers.orders.status = 'bad'"],
              measures: [{formula: "count(*)", name: v}]}

  - id: Q10-cube-not-equals-null
    row: Q10
    title: "notEquals adds OR IS NULL: childless Frank passes orders.status != 'bad'"
    truth_sql: |
      select name, 1 from customers c where exists (
        select 1 from customers c2 left join orders o on o.customer_id = c2.id where c2.id = c.id and o.status is distinct from 'bad')
    contrast_sql: select name, 1 from customers where id in (select customer_id from orders where status <> 'bad')
    compare: {keys: [customers.name], values: [customers.count]}
    cube:
      rest: {dimensions: [customers.name], measures: [customers.count],
             filters: [{member: orders.status, operator: notEquals, values: [bad]}]}

  - id: Q10-cube-not-set
    row: Q10
    title: notSet on orders.id by customer name finds the customer with no orders
    truth_sql: select name, 1 from customers where id not in (select customer_id from orders where customer_id is not null)
    compare: {keys: [customers.name], values: [customers.count]}
    cube:
      rest: {dimensions: [customers.name], measures: [customers.count],
             filters: [{member: orders.id, operator: notSet}]}

  - id: Q10-cube-not-set-measure-only
    row: Q10
    title: "the same notSet without a dimension roots at orders and finds nobody (Tesseract)"
    note: with only customers measures and an orders filter, the query roots at orders, where orders.id is never NULL
    truth_sql: |
      select count(distinct c.id), sum(c.credit) from orders o left join customers c on o.customer_id = c.id where o.id is null
    contrast_sql: select count(*), sum(credit) from customers where id not in (select customer_id from orders where customer_id is not null)
    compare: {values: [customers.count, customers.credit_sum]}
    cube:
      planners: [tesseract]
      rest: {measures: [customers.count, customers.credit_sum], filters: [{member: orders.id, operator: notSet}]}


  - id: Q10-cube-not-set-measure-only-legacy
    row: Q10
    title: "legacy: the same measure-only notSet roots at customers and finds Frank"
    truth_sql: select count(*), sum(credit) from customers where id not in (select customer_id from orders where customer_id is not null)
    compare: {values: [customers.count, customers.credit_sum]}
    cube:
      planners: [legacy]
      rest: {measures: [customers.count, customers.credit_sum], filters: [{member: orders.id, operator: notSet}]}

  - id: Q10-cube-not-equals-measure-only-legacy
    row: Q10
    title: "legacy: measure-only notEquals roots at customers, so childless Frank passes"
    truth_sql: |
      select count(*), sum(credit) from customers c where exists (
        select 1 from customers c2 left join orders o on o.customer_id = c2.id where c2.id = c.id and o.status is distinct from 'bad')
    contrast_sql: select count(*), sum(credit) from customers where id in (select customer_id from orders where status <> 'bad')
    compare: {values: [customers.count, customers.credit_sum]}
    cube:
      planners: [legacy]
      rest: {measures: [customers.count, customers.credit_sum],
             filters: [{member: orders.status, operator: notEquals, values: [bad]}]}
  # ------------------------------------------------------------------ Q11 rolling time windows
  - id: Q11a
    row: Q11
    title: trailing 90-day sum per month
    truth_sql: |
      select m, (select sum(amount) from orders o
                 where o.order_date >= m + interval 1 month - interval 90 day and o.order_date < m + interval 1 month)
      from (select distinct date_trunc('month', order_date) m from orders)
    compare: {keys: [order_date], values: [v]}
    slayer:
      query: {source_model: orders, time_dimensions: [{dimension: order_date, granularity: month}],
              measures: [{formula: "sum(amount, window='90d')", name: v}]}

  - id: Q11-count_distinct
