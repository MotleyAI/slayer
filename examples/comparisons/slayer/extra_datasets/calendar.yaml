# Hand-made calendar: one row per day, joined from each fact's date.
name: calendar
data_source: probe
sql: "select cast(d as date) as day from generate_series(date '2024-01-01', date '2025-06-30', interval 1 day) t(d)"
fields:
  - {name: day, datatype: Date, primary_key: true}
relationships:
  - {to: orders, from_columns: [day], to_columns: [order_date], cardinality: one_to_many}
  - {to: returns, from_columns: [day], to_columns: [return_date], cardinality: one_to_many}
