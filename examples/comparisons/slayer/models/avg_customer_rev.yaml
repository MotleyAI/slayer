# Query-backed dataset: average per-customer revenue (two stages).
name: avg_customer_rev
source_queries:
  - name: per_customer
    population: orders
    dimensions: [orders.customer_id, orders.status]
    metrics: [{metric: "sum(orders.amount)", alias: rev}]
  - population: per_customer
    metrics: [{metric: "avg(per_customer.rev)", alias: avg_rev}]
