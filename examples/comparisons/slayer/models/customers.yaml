name: customers
data_source: probe
sql_table: customers
fields:
  - {name: id, datatype: Float, primary_key: true}
  - {name: name, datatype: String}
  - {name: region_id, datatype: Float}
  - {name: city, datatype: String}
  - {name: tier, datatype: String}
  - {name: credit, datatype: Float}
  - {name: discount, datatype: Float}
  - {name: tags, datatype: ARRAY, element_type: TEXT}
relationships:
  - {to: regions, from_columns: [region_id], to_columns: [id], cardinality: many_to_one}
