name: customers
data_source: probe
sql_table: customers
fields:
  - {name: id, datatype: number, primary_key: true}
  - {name: name, datatype: string}
  - {name: region_id, datatype: number}
  - {name: city, datatype: string}
  - {name: tier, datatype: string}
  - {name: credit, datatype: number}
  - {name: discount, datatype: number}
  - {name: tags, datatype: ARRAY, element_type: TEXT}
relationships:
  - {to: regions, join_pairs: [[region_id, id]], cardinality: many_to_one}
