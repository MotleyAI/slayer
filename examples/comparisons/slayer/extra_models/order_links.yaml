# No time field, to-one to both facts: two equally short routes to the time spine.
name: order_links
data_source: probe
sql: "select id, id as order_id, id as return_id from orders"
fields:
  - {name: id, datatype: number, primary_key: true}
  - {name: order_id, datatype: number}
  - {name: return_id, datatype: number}
relationships:
  - {to: orders, join_pairs: [[order_id, id]], cardinality: many_to_one}
  - {to: returns, join_pairs: [[return_id, id]], cardinality: many_to_one}
