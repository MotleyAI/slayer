# No time field, to-one to both facts: two equally short routes to the time spine.
name: order_links
data_source: probe
sql: "select id, id as order_id, id as return_id from orders"
fields:
  - {name: id, datatype: Float, primary_key: true}
  - {name: order_id, datatype: Float}
  - {name: return_id, datatype: Float}
relationships:
  - {to: orders, from_columns: [order_id], to_columns: [id], cardinality: many_to_one}
  - {to: returns, from_columns: [return_id], to_columns: [id], cardinality: many_to_one}
