    caveat: "A one-time scaffold that rewrites the model folder. Foreign keys are read only on Postgres, MySQL and Redshift; elsewhere joins come from `*_id` names (source)."
  metricflow:
    verdict: 'no'
    text: "Semantic models are hand-written YAML; dbt-codegen scaffolds sources and staging models only."
  comment: "SLayer and Cube generate models with joins; only SLayer re-ingests additively."
- id: C30
  group: Beyond query semantics
  name: Runtime model editing
  intent: "Add a column, measure or join through an API and use it in the next query: no build, no restart."
  origin: SLayer
  slayer:
    verdict: 'yes'
    how: "`edit_model(model_name=\"orders\", measures=[{\"name\": \"aov\", \"formula\": \"sum(amount) / count(*)\"}])`"
    caveat: "Over MCP, REST, CLI or Python; the next query sees it (probe-verified)."
  malloy:
    verdict: partial
    text: "Edit `.malloy` files, then `reload_package` or watch mode; no restart."
    caveat: No API writes model files.
  cube:
    verdict: partial
    text: "Dev mode re-reads changed model files on the next request; `repositoryFactory` + `schemaVersion` load models from elsewhere."
    caveat: "No API writes models in Core; API editing is a Cube Cloud feature."
  metricflow:
    verdict: 'no'
    text: "Edit YAML, then `dbt parse` rebuilds the manifest `mf` reads."
    caveat: No create or edit API.
  comment: "Only SLayer takes model changes through its own API."
- id: C31
  group: Beyond query semantics
  name: Schema drift handling
  intent: "Notice when the warehouse changes under the models, and say what to fix."
  origin: SLayer
  slayer:
    verdict: 'yes'
    how: "`validate_models` · `SchemaDriftError`"
    caveat: "A failing query names the drifted model; `validate_models` returns the `edit_model` call that fixes it; re-ingestion keeps hand edits (probe-verified)."
  malloy:
    verdict: partial
    text: "A dropped column is a compile error with file and line at reload; Publisher keeps serving the previous model, flagged stale."
    caveat: Nothing checks the warehouse until a reload or compile.
  cube:
    verdict: 'no'
    text: "Nothing checks models against the warehouse; a dropped column is a raw database error at query time."
    caveat: "`cubejs validate` compiles the files without a database connection."
  metricflow:
    verdict: partial
    how: "`mf validate-configs`"
    caveat: "Dry-runs each element against the warehouse and names the broken one; column types aren't compared, and queries surface the raw warehouse error."
  comment: "SLayer detects drift at query time too and proposes the fix; elsewhere it is a validation run or a compile error."
