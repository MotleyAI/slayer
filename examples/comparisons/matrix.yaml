    caveat: "Foreign keys become joins and comments descriptions; join cardinality from the keys. Re-runs add without overwriting (probe-verified)."
  malloy:
    verdict: partial
    text: "`conn.table('x')` reads a table's columns at compile time; joins and measures are written by hand."
  cube:
    verdict: partial
