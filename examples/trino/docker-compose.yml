services:
  trino:
    image: trinodb/trino:483
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

  seed:
    build:
      context: ../..
    command: python /examples/seed.py trino://slayer@trino:8080/memory/default
    volumes:
      - ../seed.py:/examples/seed.py:ro
    depends_on:
      trino:
        condition: service_healthy

  slayer:
    build:
      context: ../..
    command: sh /examples/start.sh
    ports:
      - "5143:5143"
    volumes:
      - ./start.sh:/examples/start.sh:ro
      - ./slayer_data:/data
    depends_on:
      seed:
        condition: service_completed_successfully
