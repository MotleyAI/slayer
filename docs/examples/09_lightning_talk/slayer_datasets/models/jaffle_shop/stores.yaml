version: 32
name: stores
sql_table: stores
source_kind: table
query_variables: {}
data_source: jaffle_shop
fields:
- name: id
  expression: id
  datatype: String
  primary_key: true
  unique: false
  label: Store ID
  hidden: false
- name: name
  expression: name
  datatype: String
  primary_key: false
  unique: false
  description: Store name.
  label: Store
  hidden: false
- name: opened_at
  expression: opened_at
  datatype: Date
  primary_key: false
  unique: false
  description: When the store opened.
  label: Opened
  hidden: false
- name: tax_rate
  expression: tax_rate
  datatype: Float
  primary_key: false
  unique: false
  description: Local sales-tax rate.
  label: Tax Rate
  hidden: false
  format:
    type: percent
    precision: 1
- name: region_id
  expression: region_id
  datatype: String
  primary_key: false
  unique: false
  description: Region the store belongs to.
  label: Region ID
  hidden: false
metrics:
- expression: count_distinct(id)
  name: store_count
  label: Stores
  description: Number of stores.
  datatype: Integer
aggregations: []
relationships:
- to: regions
  from_columns:
  - region_id
  to_columns:
  - id
  join_type: left
  cardinality: many_to_one
  trusted: true
enforced_keys:
- - id
filters: []
description: Physical Jaffle Shop locations.
hidden: false
access_tags: []
