version: 30
name: supplies
sql_table: supplies
source_kind: table
query_variables: {}
data_source: jaffle_shop
fields:
- name: id
  expression: id
  datatype: String
  primary_key: true
  unique: false
  label: Supply ID
  hidden: false
- name: name
  expression: name
  datatype: String
  primary_key: false
  unique: false
  description: Supply name.
  label: Supply
  hidden: false
- name: cost
  expression: cost
  datatype: Decimal
  db_type: DECIMAL(12,2)
  primary_key: false
  unique: false
  description: Cost per unit, in dollars.
  label: Unit Cost
  hidden: false
  format:
    type: currency
    precision: 2
    symbol: $
- name: perishable
  expression: perishable
  datatype: String
  primary_key: false
  unique: false
  description: Whether the supply is perishable.
  label: Perishable
  hidden: false
- name: sku
  expression: sku
  datatype: String
  primary_key: true
  unique: false
  description: Product this supply is used for.
  label: Product
  hidden: false
metrics:
- expression: sum(cost)
  name: total_supply_cost
  label: Total Supply Cost
  description: Total supply cost, in dollars.
  datatype: Float
- expression: avg(cost)
  name: avg_unit_cost
  label: Avg Unit Cost
  description: Average supply unit cost, in dollars.
  datatype: Float
aggregations: []
relationships:
- to: products
  from_columns:
  - sku
  to_columns:
  - sku
  join_type: left
  cardinality: many_to_one
  trusted: true
enforced_keys:
- - id
  - sku
filters: []
description: Supplies (ingredients and packaging) used per product, with unit costs
  in dollars.
hidden: false
access_tags: []
