version: 29
name: tweets
sql_table: tweets
source_kind: table
query_variables: {}
data_source: jaffle_shop
fields:
- name: id
  expression: id
  datatype: String
  primary_key: true
  unique: false
  label: Tweet ID
  hidden: false
- name: user_id
  expression: user_id
  datatype: String
  primary_key: false
  unique: false
  description: Customer who tweeted.
  label: Customer ID
  hidden: false
- name: tweeted_at
  expression: tweeted_at
  datatype: Date
  primary_key: false
  unique: false
  description: When the tweet was posted.
  label: Tweet Date
  hidden: false
- name: content
  expression: content
  datatype: String
  primary_key: false
  unique: false
  description: Tweet text.
  label: Tweet
  hidden: false
metrics:
- expression: count(id)
  name: tweet_count
  label: Tweets
  description: Number of tweets.
  datatype: Integer
aggregations: []
relationships:
- to: customers
  from_columns:
  - user_id
  to_columns:
  - id
  join_type: left
  cardinality: many_to_one
  trusted: true
enforced_keys:
- - id
filters: []
default_time_dimension: tweeted_at
description: Synthetic customer tweets mentioning the Jaffle Shop.
hidden: false
access_tags: []
