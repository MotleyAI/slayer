# A worked Ossie (OSI) document for the SLayer import demo, in the current
# core-spec shape: one semantic model at the root, portable `sql` expressions
# (OSSIE_SQL_2026), declared `datatype`s, and dataset-scoped metrics.
#
# It describes a small retail shop over four tables (orders, customers,
# products, regions) and exercises:
#   * ai_context on the model, datasets, fields, relationships and metrics
#   * custom_extensions carried into column meta
#   * relationships that become SLayer joins (incl. a multi-hop chain)
#   * dataset-scoped metrics, a FILTER metric, and cross-dataset / multi-hop
#     model-scoped metrics (which reference fields as dataset.field)
#
# Sources are bare table names, resolved against the demo DuckDB.
version: "0.2.0.dev0"
name: shop
description: Retail shop semantic model
ai_context:
  instructions: "Use for order, customer, and product analytics."
  synonyms:
    - "store"
    - "retail"

datasets:
  - name: orders
    source: orders
    primary_key: [order_id]
    description: Order line items
    ai_context:
      instructions: "One row per order."
      synonyms:
        - "sales"
        - "purchases"
    fields:
      - name: order_id
        expression: {sql: order_id}
        datatype: Integer
        description: Order id
      - name: customer_id
        expression: {sql: customer_id}
        datatype: Integer
      - name: product_id
        expression: {sql: product_id}
        datatype: Integer
      - name: amount
        expression: {sql: amount}
        datatype: Float
        label: Order amount
        ai_context:
          instructions: "Gross order value in USD."
          synonyms:
            - "revenue"
            - "gross"
        custom_extensions:
          - vendor_name: SNOWFLAKE
            data: '{"unit": "usd"}'
      - name: quantity
        expression: {sql: quantity}
        datatype: Integer
      - name: ordered_at
        expression: {sql: ordered_at}
        datatype: Date
      - name: status
        expression: {sql: status}
        datatype: String
    metrics:
      - name: total_amount
        description: Total order amount
        ai_context:
          instructions: "Sum of gross order value."
          synonyms:
            - "gmv"
        expression: {sql: "SUM(amount)"}
        datatype: Float
      - name: completed_amount
        description: Order amount of completed orders only
        expression: {sql: "SUM(amount) FILTER (WHERE status = 'completed')"}
        datatype: Float
      - name: order_count
        expression: {sql: "COUNT(*)"}
        datatype: Integer
      - name: aov
        description: Average order value
        expression: {sql: "SUM(amount) / COUNT(*)"}
        datatype: Float
      - name: revenue_line
        description: Quantity-weighted revenue
        expression: {sql: "SUM(quantity * amount)"}
        datatype: Float

  - name: customers
    source: customers
    primary_key: [customer_id]
    fields:
      - name: customer_id
        expression: {sql: customer_id}
        datatype: Integer
      - name: region_id
        expression: {sql: region_id}
        datatype: Integer
      - name: name
        expression: {sql: name}
        datatype: String
      - name: segment
        expression: {sql: segment}
        datatype: String

  - name: products
    source: products
    primary_key: [product_id]
    fields:
      - name: product_id
        expression: {sql: product_id}
        datatype: Integer
      - name: category
        expression: {sql: category}
        datatype: String
      - name: price
        expression: {sql: price}
        datatype: Float

  - name: regions
    source: regions
    primary_key: [region_id]
    fields:
      - name: region_id
        expression: {sql: region_id}
        datatype: Integer
      - name: name
        expression: {sql: name}
        datatype: String
      - name: population
        expression: {sql: population}
        datatype: Integer

relationships:
  - name: orders_to_customers
    from: orders
    to: customers
    from_columns: [customer_id]
    to_columns: [customer_id]
    ai_context:
      instructions: "Each order has one customer."
  - name: orders_to_products
    from: orders
    to: products
    from_columns: [product_id]
    to_columns: [product_id]
  - name: customers_to_regions
    from: customers
    to: regions
    from_columns: [region_id]
    to_columns: [region_id]

metrics:
  - name: cust_reach
    description: Amount per distinct customer (cross-dataset)
    expression: {sql: "SUM(orders.amount) / COUNT(DISTINCT customers.customer_id)"}
    datatype: Float
  - name: rev_plus_pop
    description: Amount plus region population (multi-hop orders->customers->regions)
    expression: {sql: "SUM(orders.amount) + SUM(regions.population)"}
    datatype: Float
