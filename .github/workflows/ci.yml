name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    # Run CI for every PR regardless of base branch — stacked PRs
    # targeting feature branches (e.g. `egor/dev-1450-…`) need the
    # same lint + test gate as PRs to main.
    branches: ['**']

env:
  # jaffle-shop-generator is not on PyPI; the demo-DB cache key carries this pin too.
  JAFGEN_SHA: 09557a1118b000071f8171aa97d54d5029bf0f0b

jobs:
  # Full basedpyright check against the committed ratchet baseline; parallel, as it needs ~3 GB.
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same inputs as the other 3.11 jobs, so they share the venv cache.
      - uses: ./.github/actions/poetry-env
        with:
          python-version: "3.11"

      - name: Type-check (no new errors vs .basedpyright/baseline.json)
        run: poetry run basedpyright

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/poetry-env
        with:
          python-version: "3.11"

      - name: Lint with ruff
        run: poetry run ruff check slayer/ tests/

      - name: Check living-architecture cross-walk
        run: poetry run la-arch-check

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (for the Flight SQL JDBC tests)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: ./.github/actions/poetry-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install jafgen (for the demo and notebook tests, not on PyPI)
        run: poetry run pip install "git+https://github.com/rossbowen/jaffle-shop-generator.git@${JAFGEN_SHA}"

      - name: Run unit tests (shard ${{ matrix.shard }}/3)
        timeout-minutes: 20
        # One of three duration-balanced module groups (tests/_sharding.py); -n logical
        # uses every vCPU (-n auto only the physical cores).
        run: poetry run pytest tests/ -m "not integration" --timeout=120 -n logical --durations=25 --shard ${{ matrix.shard }}/3

  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (for the Flight SQL JDBC tests)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: ./.github/actions/poetry-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install jafgen (for the demo and notebook tests, not on PyPI)
        run: poetry run pip install "git+https://github.com/rossbowen/jaffle-shop-generator.git@${JAFGEN_SHA}"

      # Install a pinned, checksum-verified DuckDB CLI into ~/.duckdb/cli/latest
      # (the layout the installer uses and the 15_duckdb notebook expects on
      # PATH). Cached across runs; on a miss we fetch a pinned release and verify
      # its SHA256 instead of piping a remote installer to bash. With the binary
      # already on PATH, the notebook's idempotent `command -v duckdb || curl …`
      # cell never reaches the network.
      - name: Cache the DuckDB CLI
        id: duckdb-cache
        uses: actions/cache@v4
        with:
          path: ~/.duckdb/cli
          key: duckdb-cli-${{ runner.os }}-v1.5.5

      - name: Install the pinned DuckDB CLI (verified)
        if: steps.duckdb-cache.outputs.cache-hit != 'true'
        env:
          DUCKDB_VERSION: v1.5.5
          DUCKDB_SHA256: 08c0ca117111fcede14239d0093792352befdc174218c344d232c13279643d05
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl --proto "=https" --tlsv1.2 -fsSL -o "$tmp/duckdb.zip" \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip"
          echo "${DUCKDB_SHA256}  ${tmp}/duckdb.zip" | sha256sum -c -
          mkdir -p "$HOME/.duckdb/cli/latest"
          unzip -o -q "$tmp/duckdb.zip" -d "$HOME/.duckdb/cli/latest"
          chmod +x "$HOME/.duckdb/cli/latest/duckdb"
          rm -rf "$tmp"

      - name: Put the DuckDB CLI on PATH
        run: echo "$HOME/.duckdb/cli/latest" >> "$GITHUB_PATH"

      # The notebooks' demo DuckDB (~2 min of jafgen): built, or restored and date-shifted to today,
      # before pytest so no worker rewrites it mid-run; saved before pytest so the cache stays pristine.
      - name: Restore the notebook demo DuckDB
        id: demo-db-cache
        uses: actions/cache/restore@v4
        with:
          path: docs/examples/jaffle_data/demo/jaffle_shop.duckdb
          key: notebook-demo-db-${{ runner.os }}-${{ env.JAFGEN_SHA }}-${{ hashFiles('poetry.lock', 'slayer/demo/**', 'tests/integration/_demo_build.py') }}

      - name: Build or refresh the notebook demo DuckDB
        run: poetry run python -c "from tests.integration._demo_build import build_notebook_demo_db; build_notebook_demo_db()"

      - name: Save the notebook demo DuckDB
        if: steps.demo-db-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: docs/examples/jaffle_data/demo/jaffle_shop.duckdb
          key: ${{ steps.demo-db-cache.outputs.cache-primary-key }}

      - name: Run integration tests
        timeout-minutes: 20
        # The MySQL / ClickHouse / SQL Server / Trino pytest integration
        # suites have their own path-gated workflows under
        # .github/workflows/integration-<dialect>.yml. They require Docker
        # + testcontainers + (for SQL Server) the ODBC Driver 18 — provisioned
        # only in those workflows. Exclude them from the always-on integration
        # job; they run when their respective dialect files change.
        #
        # The live-Metabase e2e suite (`metabase_e2e` marker) has
        # its own workflow at .github/workflows/pg-facade-e2e.yml — same
        # reasoning, exclude here so this job isn't on the hook for booting
        # a Metabase container.
        # -n logical --dist loadscope: parallelise across all vCPUs, but pin each
        # test module to one worker so the notebook suite's fixed-path DuckDB
        # (single-writer) can't hit a cross-process lock. --durations logs slowest.
        run: |
          poetry run pytest tests/ -m "integration and not metabase_e2e" --timeout=180 --durations=25 \
            -n logical --dist loadscope \
            --ignore=tests/integration/test_integration_mysql.py \
            --ignore=tests/integration/test_integration_clickhouse.py \
            --ignore=tests/integration/test_integration_sqlserver.py \
            --ignore=tests/integration/test_integration_trino.py

  # The previous `integration-examples` matrix (verify.py-based
  # end-to-end checks for ClickHouse + MySQL) migrated into the per-dialect
  # workflows so each dialect's CI lives in one place and is path-gated.
  # SQL Server gained its first verify.py-based CI coverage there too.

  bigquery-example:
    # Skip on forked-PR runs where the GCP secrets aren't available — the job
    # would fail otherwise and we'd rather not nag external contributors.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    # One run at a time in the shared GCP project; overlapping runs queue, never cancel.
    concurrency:
      group: bigquery-shared-gcp-project
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4

      - name: Skip if GCP secrets are unset
        id: gate
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_SA_KEY_B64: ${{ secrets.GCP_SA_KEY_B64 }}
        run: |
          if [[ -z "$GCP_PROJECT_ID" || -z "$GCP_SA_KEY_B64" ]]; then
            echo "BigQuery secrets unset — skipping the example."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.skip != 'true'
        uses: ./.github/actions/poetry-env
        with:
          python-version: "3.11"
          install-args: "-E bigquery"

      - name: Decode service-account JSON key
        if: steps.gate.outputs.skip != 'true'
        env:
          GCP_SA_KEY_B64: ${{ secrets.GCP_SA_KEY_B64 }}
        run: |
          echo "$GCP_SA_KEY_B64" | base64 -d > "$RUNNER_TEMP/sa-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa-key.json" >> "$GITHUB_ENV"

      - name: Start SLayer server
        if: steps.gate.outputs.skip != 'true'
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          poetry run bash examples/bigquery/start.sh > /tmp/slayer-bq.log 2>&1 &
          echo "SLAYER_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for SLayer API to accept connections
        if: steps.gate.outputs.skip != 'true'
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5143/health >/dev/null; then
              echo "SLayer API ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "SLayer API never came up — logs:" >&2
          cat /tmp/slayer-bq.log
          exit 1

      - name: Run verify.py
        if: steps.gate.outputs.skip != 'true'
        timeout-minutes: 5
        run: poetry run python examples/bigquery/verify.py

      - name: Run BigQuery integration tests
        if: steps.gate.outputs.skip != 'true'
        timeout-minutes: 10
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: poetry run pytest tests/integration/test_integration_bigquery.py -m integration -v

      - name: Dump server logs on failure
        if: failure() && steps.gate.outputs.skip != 'true'
        run: cat /tmp/slayer-bq.log

      - name: Stop SLayer server
        if: always() && steps.gate.outputs.skip != 'true'
        run: |
          if [ -n "${SLAYER_PID:-}" ]; then
            kill "$SLAYER_PID" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/sa-key.json"

  # The live Snowflake suite lives in integration-snowflake.yml (path-gated: Snowflake bills per query).
