name: Integration - Trino

# Per-dialect CI for Trino — the pytest suite. Path-gated to the slayer package
# plus the Trino suite and helpers. The Docker example runs in examples.yml.

permissions:
  contents: read

on:
  pull_request:
    # Every base branch: stacked PRs need the same gate as PRs to main.
    branches: ['**']
    paths:
      # The suite runs the whole package.
      - 'slayer/**'
      - 'tests/_*.py'
      - 'tests/integration/_*.py'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'tests/integration/test_integration_trino.py'
      - 'tests/integration/test_integration_ossie_gate.py'
      - 'tests/fixtures/ossie_corpus/**'
      - '.github/workflows/integration-trino.yml'
      - '.github/actions/poetry-env/**'
      - '.github/actions/engine-setup/**'
  push:
    branches: [main]
    paths:
      # The suite runs the whole package.
      - 'slayer/**'
      - 'tests/_*.py'
      - 'tests/integration/_*.py'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'tests/integration/test_integration_trino.py'
      - 'tests/integration/test_integration_ossie_gate.py'
      - 'tests/fixtures/ossie_corpus/**'
      - '.github/workflows/integration-trino.yml'
      - '.github/actions/poetry-env/**'
      - '.github/actions/engine-setup/**'
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/engine-setup
        with:
          engine: trino

      - name: Run the Trino integration tests and compliance gate
        timeout-minutes: 20
        env:
          SLAYER_GATE_ENGINES: trino
        run: |
          poetry run pytest tests/integration/test_integration_trino.py \
            tests/integration/test_integration_ossie_gate.py \
            -v -m integration --timeout=300
