name: Integration - Snowflake

# Live Snowflake suite. Snowflake bills per query, so PRs run it only when a
# Snowflake file changes; every push to main runs it.

permissions:
  contents: read

on:
  pull_request:
    # Every base branch: stacked PRs need the same gate as PRs to main.
    branches: ['**']
    paths:
      - 'slayer/sql/dialects/snowflake.py'
      - 'tests/integration/test_integration_snowflake.py'
      - 'tests/_reserved_alias_probe.py'
      - '.github/workflows/integration-snowflake.yml'
  push:
    branches: [main]

jobs:
  snowflake-integration:
    # Skip on forked-PR runs where the Snowflake secret isn't available — the
    # job would fail otherwise and we'd rather not nag external contributors.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if Snowflake secrets are unset
        id: gate
        env:
          SNOWFLAKE_CONNECTIONS_TOML: ${{ secrets.SNOWFLAKE_CONNECTIONS_TOML }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SNOWFLAKE_CONNECTIONS_TOML" || -z "$SNOWFLAKE_PRIVATE_KEY" ]]; then
            echo "Snowflake secrets unset — skipping the integration suite."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.skip != 'true'
        uses: ./.github/actions/poetry-env
        with:
          python-version: "3.11"
          install-args: "-E snowflake"

      - name: Write ~/.snowflake/connections.toml and the key-pair key from secrets
        if: steps.gate.outputs.skip != 'true'
        env:
          SNOWFLAKE_CONNECTIONS_TOML: ${{ secrets.SNOWFLAKE_CONNECTIONS_TOML }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.snowflake
          # `printf '%s'` is literal — no backslash mangling, no extra trailing
          # newline. `chmod 600` is required: snowflake-connector-python
          # refuses to load a TOML that's world-/group-readable. The profile's
          # `private_key_file = "~/.snowflake/slayer_ci_key.p8"` reads the key.
          printf '%s' "$SNOWFLAKE_CONNECTIONS_TOML" > ~/.snowflake/connections.toml
          printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > ~/.snowflake/slayer_ci_key.p8
          chmod 600 ~/.snowflake/connections.toml ~/.snowflake/slayer_ci_key.p8

      - name: Run Snowflake integration tests
        if: steps.gate.outputs.skip != 'true'
        timeout-minutes: 15
        # SLAYER_SNOWFLAKE_CONNECTION names the profile in the TOML the
        # integration suite should use. The default in the test file is
        # `slayer_test` — match the section header in
        # `secrets.SNOWFLAKE_CONNECTIONS_TOML`.
        env:
          SLAYER_SNOWFLAKE_CONNECTION: slayer_test
        run: poetry run pytest tests/integration/test_integration_snowflake.py -v -rs -m integration --timeout=300

      - name: Wipe Snowflake credentials
        if: always()
        run: rm -f ~/.snowflake/connections.toml ~/.snowflake/slayer_ci_key.p8
