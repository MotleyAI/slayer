name: Integration - Snowflake

# Live Snowflake suite. Snowflake bills per query, so PRs run it only when a
# Snowflake file changes, and then only on the pushes expensive-job-gate.yml
# allows; every push to main runs it.

permissions:
  contents: read

on:
  pull_request:
    # Every base branch: stacked PRs need the same gate as PRs to main.
    branches: ['**']
    paths:
      - 'slayer/sql/dialects/snowflake.py'
      - 'tests/integration/test_integration_snowflake.py'
      - 'tests/_reserved_alias_probe.py'
      - 'tests/integration/test_integration_ossie_gate.py'
      - 'tests/integration/_ossie_gate_servers.py'
      - 'tests/_ossie_gate*.py'
      - 'tests/fixtures/ossie_corpus/**'
      - '.github/workflows/integration-snowflake.yml'
      - '.github/actions/engine-setup/**'
  push:
    branches: [main]

jobs:
  snowflake-gate:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/expensive-job-gate.yml
    with:
      workflow: integration-snowflake.yml
      job: snowflake-integration

  snowflake-integration:
    needs: snowflake-gate
    # Skip on forked-PR runs where the Snowflake secret isn't available — the
    # job would fail otherwise and we'd rather not nag external contributors.
    if: >-
      ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && needs.snowflake-gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if Snowflake secrets are unset
        id: gate
        env:
          SNOWFLAKE_CONNECTIONS_TOML: ${{ secrets.SNOWFLAKE_CONNECTIONS_TOML }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SNOWFLAKE_CONNECTIONS_TOML" || -z "$SNOWFLAKE_PRIVATE_KEY" ]]; then
            echo "Snowflake secrets unset — skipping the integration suite."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # The full install: the compliance gate's server harness imports every engine's driver.
      - if: steps.gate.outputs.skip != 'true'
        uses: ./.github/actions/engine-setup
        with:
          engine: snowflake
          snowflake-connections-toml: ${{ secrets.SNOWFLAKE_CONNECTIONS_TOML }}
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Run Snowflake integration tests
        if: steps.gate.outputs.skip != 'true'
        timeout-minutes: 15
        # SLAYER_SNOWFLAKE_CONNECTION names the profile in the TOML the
        # integration suite should use. The default in the test file is
        # `slayer_test` — match the section header in
        # `secrets.SNOWFLAKE_CONNECTIONS_TOML`.
        env:
          SLAYER_SNOWFLAKE_CONNECTION: slayer_test
          # The secrets are present (gate above), so an unreachable Snowflake fails rather than skips.
          SLAYER_SNOWFLAKE_REQUIRED: "1"
        run: poetry run pytest tests/integration/test_integration_snowflake.py -v -rs -m integration --timeout=300

      - name: Run the compliance gate on Snowflake
        if: steps.gate.outputs.skip != 'true'
        timeout-minutes: 20
        env:
          SLAYER_SNOWFLAKE_CONNECTION: slayer_test
          SLAYER_GATE_ENGINES: snowflake
        run: poetry run pytest tests/integration/test_integration_ossie_gate.py -v -rs -m integration --timeout=600

      - name: Wipe Snowflake credentials
        if: always()
        run: rm -f ~/.snowflake/connections.toml ~/.snowflake/slayer_ci_key.p8
