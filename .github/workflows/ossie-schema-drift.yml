name: Ossie schema drift

# Weekly: compare tests/fixtures/osi/ossie-schema.json with upstream main. Never runs on PRs.
# Exit 1 = upstream changed (update the vendored copy and its .source.yaml); exit 2 = fetch failed.
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare the vendored schema with upstream
        run: python scripts/ossie_schema_drift.py
