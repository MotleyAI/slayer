name: Examples

# Builds and boots each Docker quickstart under examples/ and runs its verify.py.
# Dialect coverage is the per-dialect pytest workflows' job; this guards example rot.

permissions:
  contents: read

# A new push to a PR cancels that PR's run still in progress; other runs never cancel or queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Caught daily; PRs run it only when they change the root image or the examples.
on:
  pull_request:
    branches: ['**']
    paths:
      - Dockerfile
      - examples/**
      - .github/workflows/examples.yml
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  verify-example:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql
            wait-timeout: 180
          - db: clickhouse
            wait-timeout: 180
          - db: sqlserver
            wait-timeout: 300
          - db: trino
            wait-timeout: 180
          - db: postgres
            wait-timeout: 180
    defaults:
      run:
        working-directory: examples/${{ matrix.db }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verify.py dependencies
        # verify.py talks HTTP to the slayer container; DB drivers live inside the image.
        working-directory: .
        run: 'pip install --only-binary :all: sqlalchemy==2.0.49'

      - name: Build images
        run: docker compose build

      - name: Hand slayer_data to the container user
        run: sudo chown -R "$(docker compose run --rm --no-deps --entrypoint id slayer -u)" slayer_data

      - name: Start DB + seed
        run: docker compose up -d --wait --wait-timeout ${{ matrix.wait-timeout }} seed

      - name: Start slayer service
        run: docker compose up -d slayer

      - name: Wait for SLayer API to accept connections
        run: |
          for i in $(seq 1 120); do
            if curl -sf http://localhost:5143/datasources >/dev/null; then
              echo "SLayer API ready after ${i} attempts"
              exit 0
            fi
            if [ "$(docker compose ps -q slayer | xargs -r docker inspect -f '{{.State.Running}}')" = "false" ]; then
              echo "slayer container exited before becoming ready — logs:" >&2
              docker compose logs --no-color slayer
              exit 1
            fi
            sleep 2
          done
          echo "SLayer API never came up — logs:" >&2
          docker compose logs --no-color slayer
          exit 1

      - name: Run verify.py
        timeout-minutes: 5
        working-directory: .
        run: python examples/${{ matrix.db }}/verify.py

      - name: Dump all container logs
        if: always()
        run: docker compose logs --no-color

      - name: Tear down stack
        if: always()
        run: docker compose down -v
