name: Latest deps

permissions:
  contents: read

# Upstream breakage is caught daily; PRs run it only when they change dependencies.
on:
  pull_request:
    branches: ['**']
    paths:
      - pyproject.toml
      - poetry.lock
      - .github/workflows/latest-deps.yml
      - .github/actions/poetry-env/**
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  # A version-only bump of pyproject.toml changes no dependency, so it skips the run.
  deps-changed:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import os, subprocess, tomllib

          def git(*args):
              return subprocess.run(["git", *args], check=True, capture_output=True, text=True).stdout

          def deps(ref):
              doc = tomllib.loads(git("show", f"{ref}:pyproject.toml"))
              doc.get("project", {}).pop("version", None)
              return doc

          if os.environ["EVENT"] != "pull_request":
              run = True
          else:
              base = git("merge-base", os.environ["BASE"], os.environ["HEAD"]).strip()
              other = git("diff", "--name-only", base, os.environ["HEAD"], "--", "poetry.lock",
                          ".github/workflows/latest-deps.yml", ".github/actions/poetry-env")
              run = bool(other.strip()) or deps(base) != deps(os.environ["HEAD"])
          print(f"run={str(run).lower()}")
          EOF

  # A fresh `pip install` resolves the newest allowed SQLAlchemy / DuckDB, not the lock's.
  unit-test-latest-deps:
    needs: deps-changed
    if: needs.deps-changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/poetry-env
        with:
          python-version: "3.11"

      - name: Install jafgen (for the demo tests, not on PyPI)
        run: poetry run pip install git+https://github.com/rossbowen/jaffle-shop-generator.git@09557a1118b000071f8171aa97d54d5029bf0f0b  # NOSONAR(S8541) — source-only test dependency, pinned to a commit

      - name: Upgrade SQLAlchemy, duckdb and duckdb-engine to the newest allowed
        env:
          POETRY_INSTALLER_ONLY_BINARY: ":all:"
        run: |
          poetry run pip install --upgrade --only-binary :all: "sqlalchemy>=2.0,<2.1" duckdb duckdb-engine
          poetry run python -c "import duckdb, duckdb_engine, sqlalchemy; print('sqlalchemy', sqlalchemy.__version__, '| duckdb', duckdb.__version__, '| duckdb-engine', duckdb_engine.__version__)"

      - name: Run unit tests
        timeout-minutes: 30
        run: poetry run pytest tests/ -m "not integration" --timeout=120 -n logical --durations=25
