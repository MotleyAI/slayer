name: Latest deps

permissions:
  contents: read

# A new push to the same PR cancels its run in flight.
concurrency:
  group: latest-deps-${{ github.ref }}
  cancel-in-progress: true

# Upstream breakage is caught daily; PRs run it only when they change dependencies.
on:
  pull_request:
    branches: ['**']
    paths:
      - pyproject.toml
      - poetry.lock
      - .github/workflows/latest-deps.yml
      - .github/actions/poetry-env/**
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  # A version-only bump of pyproject.toml changes no dependency, so it skips the run.
  deps-changed:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import os, subprocess, tomllib

          def git(*args):
              return subprocess.run(["git", *args], check=True, capture_output=True, text=True).stdout

          def deps(ref):
              doc = tomllib.loads(git("show", f"{ref}:pyproject.toml"))
              doc.get("project", {}).pop("version", None)
              return doc

          if os.environ["EVENT"] != "pull_request":
              run = True
          else:
              base = git("merge-base", os.environ["BASE"], os.environ["HEAD"]).strip()
              other = git("diff", "--name-only", base, os.environ["HEAD"], "--", "poetry.lock",
                          ".github/workflows/latest-deps.yml", ".github/actions/poetry-env")
              run = bool(other.strip()) or deps(base) != deps(os.environ["HEAD"])
          print(f"run={str(run).lower()}")
          EOF

  # What a fresh `pip install motley-slayer[all]` resolves: every dependency at its newest allowed
  # version, in a clean venv with no lockfile.
  unit-test-latest-deps:
    needs: deps-changed
    if: needs.deps-changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create a clean virtualenv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      # Poetry's dev-group constraints, as pip requirements (caret → upper bound).
      - name: List the dev tools
        run: |
          python - <<'EOF' > "$RUNNER_TEMP/dev-requirements.txt"
          import re, tomllib

          def spec(constraint):
              if not constraint.startswith("^"):
                  return constraint if re.match(r"[<>=!~]", constraint) else f"=={constraint}"
              parts = [int(p) for p in constraint[1:].split(".")]
              bump = next((i for i, p in enumerate(parts) if p), len(parts) - 1)
              upper = parts[:bump] + [parts[bump] + 1]
              return f">={constraint[1:]},<{'.'.join(map(str, upper))}"

          dev = tomllib.load(open("pyproject.toml", "rb"))["tool"]["poetry"]["group"]["dev"]["dependencies"]
          for name, value in dev.items():
              if isinstance(value, str):
                  print(f"{name}{spec(value)}")
              else:
                  extras = f"[{','.join(value['extras'])}]" if value.get("extras") else ""
                  print(f"{name}{extras}{spec(value['version'])}")
          EOF
          cat "$RUNNER_TEMP/dev-requirements.txt"

      - name: Resolve every dependency fresh
        run: |
          python -m pip install --upgrade pip  # NOSONAR(S8541, S8544) — tests the unlocked, sdist-allowed resolve a fresh install performs
          python -m pip install ".[all]" -r "$RUNNER_TEMP/dev-requirements.txt"  # NOSONAR(S8541, S8544) — same: what users resolve
          python -m pip check
          python -m pip freeze

      - name: Run unit tests
        timeout-minutes: 30
        run: python -m pytest tests/ -m "not integration" --timeout=120 -n logical --durations=25
