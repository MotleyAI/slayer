name: Integration - ClickHouse

# Per-dialect CI for ClickHouse — the pytest suite. Path-gated to the slayer
# package plus the ClickHouse suite and helpers. The Docker example runs in
# examples.yml.

permissions:
  contents: read

on:
  pull_request:
    # Every base branch: stacked PRs need the same gate as PRs to main.
    branches: ['**']
    paths:
      # The suite runs the whole package.
      - 'slayer/**'
      - 'tests/_*.py'
      - 'tests/integration/_*.py'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'tests/integration/test_integration_clickhouse.py'
      - 'tests/integration/test_integration_ossie_gate.py'
      - 'tests/fixtures/ossie_corpus/**'
      - '.github/workflows/integration-clickhouse.yml'
      - '.github/actions/poetry-env/**'
      - '.github/actions/engine-setup/**'
  push:
    branches: [main]
    paths:
      # The suite runs the whole package.
      - 'slayer/**'
      - 'tests/_*.py'
      - 'tests/integration/_*.py'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'tests/integration/test_integration_clickhouse.py'
      - 'tests/integration/test_integration_ossie_gate.py'
      - 'tests/fixtures/ossie_corpus/**'
      - '.github/workflows/integration-clickhouse.yml'
      - '.github/actions/poetry-env/**'
      - '.github/actions/engine-setup/**'
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/engine-setup
        with:
          engine: clickhouse

      - name: Run the ClickHouse integration tests and compliance gate
        timeout-minutes: 20
        env:
          SLAYER_GATE_ENGINES: clickhouse
        run: |
          poetry run pytest tests/integration/test_integration_clickhouse.py \
            tests/integration/test_integration_ossie_gate.py \
            -v -m integration --timeout=300
