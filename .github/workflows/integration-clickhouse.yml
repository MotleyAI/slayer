name: Integration - ClickHouse

# Per-dialect CI for ClickHouse — the pytest suite. Path-gated to the slayer
# package plus the ClickHouse suite and helpers. The Docker example runs in
# examples.yml.

permissions:
  contents: read

on:
  pull_request:
    # Every base branch: stacked PRs need the same gate as PRs to main.
    branches: ['**']
    paths:
      # The suite runs the whole package.
      - 'slayer/**'
      - 'tests/_*.py'
      - 'tests/integration/_*.py'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'tests/integration/test_integration_clickhouse.py'
      - '.github/workflows/integration-clickhouse.yml'
      - '.github/actions/poetry-env/**'
  push:
    branches: [main]
    paths:
      # The suite runs the whole package.
      - 'slayer/**'
      - 'tests/_*.py'
      - 'tests/integration/_*.py'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'tests/integration/test_integration_clickhouse.py'
      - '.github/workflows/integration-clickhouse.yml'
      - '.github/actions/poetry-env/**'
  workflow_dispatch:

# A new push to a PR cancels that PR's run still in progress; other runs never cancel or queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/poetry-env
        with:
          python-version: "3.11"

      - name: Verify testcontainers[clickhouse] extra is importable
        run: poetry run python -c "import testcontainers.clickhouse"

      - name: Run ClickHouse integration tests
        timeout-minutes: 20
        run: |
          poetry run pytest tests/integration/test_integration_clickhouse.py \
            -v -m integration --timeout=300
