name: Integration - MySQL

# Per-dialect CI for MySQL — the testcontainers pytest suite. Path-gated to the
# slayer package plus the MySQL suite and helpers. The Docker example runs in
# examples.yml.

permissions:
  contents: read

on:
  pull_request:
    # Every base branch: stacked PRs need the same gate as PRs to main.
    branches: ['**']
    paths:
      # The suite runs the whole package.
      - 'slayer/**'
      - 'tests/_*.py'
      - 'tests/integration/_*.py'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'tests/integration/test_integration_mysql.py'
      - '.github/workflows/integration-mysql.yml'
      - '.github/actions/poetry-env/**'
  push:
    branches: [main]
    paths:
      # The suite runs the whole package.
      - 'slayer/**'
      - 'tests/_*.py'
      - 'tests/integration/_*.py'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'tests/integration/test_integration_mysql.py'
      - '.github/workflows/integration-mysql.yml'
      - '.github/actions/poetry-env/**'
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/poetry-env
        with:
          python-version: "3.11"

      - name: Verify testcontainers[mysql] extra is importable
        # Surface a missing extra as a CI failure rather than as a
        # silent `importorskip` skip — the suite's value is gone if the dep
        # is absent.
        run: poetry run python -c "import testcontainers.mysql"

      - name: Run MySQL integration tests
        timeout-minutes: 20
        run: |
          poetry run pytest tests/integration/test_integration_mysql.py \
            -v -m integration --timeout=300
