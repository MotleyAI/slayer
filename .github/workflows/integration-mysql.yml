name: Integration - MySQL

# Per-dialect CI for MySQL — the testcontainers pytest suite and the
# verify.py end-to-end check. Path-gated to the MySQL files plus the shared
# code the suite exercises.

on:
  pull_request:
    branches: [main]
    paths:
      - 'slayer/sql/dialects/mysql.py'
      - 'slayer/sql/client.py'
      - 'slayer/sql/engine_factory.py'
      - 'slayer/core/models.py'
      - 'slayer/sql/dialects/__init__.py'
      - 'slayer/sql/dialects/base.py'
      - 'slayer/sql/dialects/drivers.py'
      - 'slayer/sql/generator.py'
      - 'tests/_*.py'
      - 'tests/integration/_*.py'
      - 'examples/seed.py'
      - 'examples/verify_common.py'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'examples/mysql/**'
      - 'tests/integration/test_integration_mysql.py'
      - '.github/workflows/integration-mysql.yml'
      - '.github/actions/poetry-env/**'
  push:
    branches: [main]
    paths:
      - 'slayer/sql/dialects/mysql.py'
      - 'slayer/sql/client.py'
      - 'slayer/sql/engine_factory.py'
      - 'slayer/core/models.py'
      - 'slayer/sql/dialects/__init__.py'
      - 'slayer/sql/dialects/base.py'
      - 'slayer/sql/dialects/drivers.py'
      - 'slayer/sql/generator.py'
      - 'tests/_*.py'
      - 'tests/integration/_*.py'
      - 'examples/seed.py'
      - 'examples/verify_common.py'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'examples/mysql/**'
      - 'tests/integration/test_integration_mysql.py'
      - '.github/workflows/integration-mysql.yml'
      - '.github/actions/poetry-env/**'
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/poetry-env
        with:
          python-version: "3.11"

      - name: Verify testcontainers[mysql] extra is importable
        # Surface a missing extra as a CI failure rather than as a
        # silent `importorskip` skip — the suite's value is gone if the dep
        # is absent.
        run: poetry run python -c "import testcontainers.mysql"

      - name: Run MySQL integration tests
        timeout-minutes: 20
        run: |
          poetry run pytest tests/integration/test_integration_mysql.py \
            -v -m integration --timeout=300

  verify-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verify.py dependencies
        run: 'pip install --only-binary :all: sqlalchemy==2.0.49'

      - name: Build images
        working-directory: examples/mysql
        run: docker compose build

      - name: Hand slayer_data to the container user
        working-directory: examples/mysql
        run: sudo chown -R "$(docker compose run --rm --no-deps --entrypoint id slayer -u)" slayer_data

      - name: Start DB + seed
        working-directory: examples/mysql
        run: docker compose up -d --wait --wait-timeout 180 seed

      - name: Start slayer service
        working-directory: examples/mysql
        run: docker compose up -d slayer

      - name: Wait for SLayer API to accept connections
        working-directory: examples/mysql
        run: |
          for i in $(seq 1 120); do
            if curl -sf http://localhost:5143/datasources >/dev/null; then
              echo "SLayer API ready after ${i} attempts"
              exit 0
            fi
            if [ "$(docker compose ps -q slayer | xargs -r docker inspect -f '{{.State.Running}}')" = "false" ]; then
              echo "slayer container exited before becoming ready — logs:" >&2
              docker compose logs --no-color slayer
              exit 1
            fi
            sleep 2
          done
          echo "SLayer API never came up — logs:" >&2
          docker compose logs --no-color slayer
          exit 1

      - name: Run verify.py
        timeout-minutes: 5
        run: python examples/mysql/verify.py

      - name: Dump all container logs
        if: always()
        working-directory: examples/mysql
        run: docker compose logs --no-color

      - name: Tear down stack
        if: always()
        working-directory: examples/mysql
        run: docker compose down -v
