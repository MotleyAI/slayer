name: Expensive-job gate

# Called by a workflow before jobs that bill per run (Snowflake, BigQuery) or take many runner-minutes (Python 3.14).
# On a pull-request push the jobs run only if the PR was just opened, or any of them never finished on the PR, last
# finished with a failure, or had the PR's OpenSpec change archived since it last finished; other events always run
# them. The caller's own conditions still apply.

on:
  workflow_call:
    inputs:
      workflow:
        description: The calling workflow's file name, e.g. ci.yml.
        type: string
        required: true
      jobs:
        description: The gated jobs' names as the Actions API reports them, one per line.
        type: string
        required: true
    outputs:
      run:
        description: "'true' if the gated jobs should run."
        value: ${{ jobs.gate.outputs.run }}

jobs:
  gate:
    runs-on: ubuntu-latest
    # The caller's job must grant the same: a called workflow can't raise its token's permissions.
    permissions:
      contents: read
      actions: read  # the jobs' earlier runs on this PR
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether the gated jobs run
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_WORKFLOW: ${{ inputs.workflow }}
          GATE_JOBS: ${{ inputs.jobs }}
        run: |
          args=()
          while IFS= read -r name; do
            if [ -n "$name" ]; then args+=(--job "$name"); fi
          done <<< "$GATE_JOBS"
          python3 -m scripts.expensive_ci_gate --workflow "$GATE_WORKFLOW" "${args[@]}"
