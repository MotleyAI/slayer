name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/poetry-env
        with:
          python-version: "3.12"
          install-args: "--no-interaction"

      - name: Check release tag matches package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(poetry version -s)"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag '$TAG' does not match pyproject.toml version '$version' at ${GITHUB_SHA::8}. Merge the version bump first, then point the tag at that commit and re-publish the release."
            exit 1
          fi

      - name: Build package
        run: poetry build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
