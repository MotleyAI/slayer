name: Publish to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/poetry-env
        with:
          python-version: "3.12"
          install-args: "--no-interaction"

      - name: Build package
        run: poetry build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # No id-token here: the unlocked install and the gated code must not be able to mint an upload token.
  gate:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/poetry-env
        with:
          python-version: "3.12"
          install-args: "--no-interaction"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Gate the built wheel
        uses: ./.github/actions/wheel-gate
        timeout-minutes: 30
        with:
          python-version: "3.12"

  publish:
    needs: [build, gate]
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Trusted publishing (OIDC)

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
